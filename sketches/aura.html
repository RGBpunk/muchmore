  } else if (m.sight === "Verge") {
    drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
  } else {
    drawEye(pg, left, rx, ry, m.sight, 0)
    drawEye(pg, right, rx, ry, m.sight, 0)
  }
  
  pg.pop()
}

// Calculate the current Omnia hue for tinting
function getOmniaColor() {
  const cycleSpeed = 0.08
  const palette = PARAMS.palette
  
  const complementaryHues = palette.map(c => {
    const col = color(c)
    const h = hue(col)
    return (h + 180) % 360
  })
  
  const cyclePosition = (millis() * cycleSpeed) % (complementaryHues.length * 100)
  const colorIndex = floor(cyclePosition / 100) % complementaryHues.length
  const nextIndex = (colorIndex + 1) % complementaryHues.length
  const blend = (cyclePosition % 100) / 100
  
  const currentHue = lerp(complementaryHues[colorIndex], complementaryHues[nextIndex], blend)
  
  return color(currentHue, 100, 100)
}

function drawMaskSilhouette(pg, m) {
  pg.push()
  pg.translate(m.x, m.y)
  pg.rotate(PARAMS.axisLock ? 0 : m.rot)
  pg.noStroke()
  pg.fill(255)
  drawMaskShape(pg, m)

  drawOrnaments(pg, m)

  drawTusks(pg, m)

  drawEyes(pg, m)

  pg.push()
  pg.erase()
  carveMouth(pg, m)
  carveNose(pg, m)
  carveCutouts(pg, m)
  pg.noErase()
  pg.pop()

  pg.pop()
}

function drawMaskShape(pg, m) {
  const pts = silhouettePoints(m.w, m.h, m.edgeStyle)
  if (m.edgeStyle === "Curved") {
    pg.beginShape()
    const first = pts[0], last = pts[pts.length - 1]
    pg.curveVertex(last.x, last.y)
    for (const p of pts) pg.curveVertex(p.x, p.y)
    pg.curveVertex(first.x, first.y)
    pg.curveVertex(pts[1].x, pts[1].y)
    pg.endShape(CLOSE)
  } else {
    pg.beginShape()
    for (const p of pts) pg.vertex(p.x, p.y)
    pg.endShape(CLOSE)
  }
}

function stylizeEdge(p, style, snap) {
  if (style === "Faceted") {
    return { x: round(p.x / snap) * snap, y: round(p.y / snap) * snap }
  }
  if (style === "Straight") {
    const ax = abs(p.x) > abs(p.y) ? { x: p.x, y: round(p.y / snap) * snap } : { x: round(p.x / snap) * snap, y: p.y }
    return ax
  }
  return p
}

function silhouettePoints(w, h, edgeStyle) {
  const bw = w * 0.5, bh = h * 0.5

  let base = [
    { x: 0, y: -bh * 0.92 },
    { x: bw * 0.45, y: -bh * 0.78 },
    { x: bw * 0.68, y: -bh * 0.35 },
    { x: bw * 0.72, y: bh * 0.05 },
    { x: bw * 0.58, y: bh * 0.55 },
    { x: 0, y: bh * 0.72 },
    { x: -bw * 0.58, y: bh * 0.55 },
    { x: -bw * 0.72, y: bh * 0.05 },
    { x: -bw * 0.68, y: -bh * 0.35 },
    { x: -bw * 0.45, y: -bh * 0.78 },
  ]

  const snap = min(w, h) * (edgeStyle === "Faceted" ? 0.05 : 0.035)
  base = base.map((p) => stylizeEdge(p, edgeStyle, snap))
  return base
}

/* ========================= FACIAL FEATURES ========================= */

// Eye positioning constants (relative to mask dimensions)
const EYE_RADIUS_X_RATIO = 0.22
const EYE_RADIUS_Y_RATIO = 0.13
const EYE_Y_OFFSET_RATIO = -0.12
const EYE_X_SPACING_RATIO = 0.18

// (Keeping all the existing facial feature drawing functions...)

function drawTusks(pg, m) {
  if (m.voice !== "Downfall") return
  
  const y = m.h * 0.27
  const tuskTopWidth = m.w * 0.12
  const tuskTipWidth = m.w * 0.03
  const tuskHeight = m.h * 0.25
  const tuskSpacing = m.w * 0.18
  
  pg.push()
  pg.fill(255)
  pg.noStroke()
  
  pg.push()
  pg.translate(-tuskSpacing, y)
  pg.beginShape()
  pg.vertex(-tuskTopWidth * 0.5, 0)
  pg.bezierVertex(
    -tuskTopWidth * 0.5, tuskHeight * 0.3,
    -tuskTipWidth * 0.8, tuskHeight * 0.7,
    -tuskTipWidth * 0.3, tuskHeight
  )
  pg.vertex(0, tuskHeight * 0.95)
  pg.bezierVertex(
    tuskTipWidth * 0.3, tuskHeight * 0.7,
    tuskTopWidth * 0.3, tuskHeight * 0.3,
    tuskTopWidth * 0.5, 0
  )
  pg.endShape(CLOSE)
  pg.pop()
  
  pg.push()
  pg.translate(tuskSpacing, y)
  pg.beginShape()
  pg.vertex(-tuskTopWidth * 0.5, 0)
  pg.bezierVertex(
    -tuskTopWidth * 0.3, tuskHeight * 0.3,
    -tuskTipWidth * 0.3, tuskHeight * 0.7,
    0, tuskHeight * 0.95
  )
  pg.vertex(tuskTipWidth * 0.3, tuskHeight)
  pg.bezierVertex(
    tuskTipWidth * 0.8, tuskHeight * 0.7,
    tuskTopWidth * 0.5, tuskHeight * 0.3,
    tuskTopWidth * 0.5, 0
  )
  pg.endShape(CLOSE)
  pg.pop()
  
  pg.pop()
}

function drawEyes(pg, m) {
  let eyeColor, strokeColor, strokeW;
  
  if (TRAITS.iris === "Null") {
    eyeColor = 255;
    strokeColor = 0;
    strokeW = m.w * 0.015;
  } else if (TRAITS.iris === "Abyss") {
    eyeColor = 0;
    strokeColor = 255;
    strokeW = m.w * 0.012;
  } else {
    eyeColor = 255;
    strokeColor = 0;
    strokeW = m.w * 0.012;
  }
  
  const rx = m.w * 0.22
  const ry = m.h * 0.13
  const ly = -m.h * 0.12
  const left = { x: -m.w * 0.18, y: ly }
  const right = { x: m.w * 0.18, y: ly }

  pg.push()
  pg.noStroke()
  
  pg.fill(strokeColor)
  if (m.sight === "Mono") {
    const center = { x: 0, y: ly }
    drawEye(pg, center, rx, ry, m.sight, strokeW)
  } else if (m.sight === "Verge") {
    drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, strokeW)
  } else {
    drawEye(pg, left, rx, ry, m.sight, strokeW)
    drawEye(pg, right, rx, ry, m.sight, strokeW)
  }
  
  pg.fill(eyeColor)
  if (m.sight === "Mono") {
    const center = { x: 0, y: ly }
    drawEye(pg, center, rx, ry, m.sight, 0)
  } else if (m.sight === "Verge") {
    drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
  } else {
    drawEye(pg, left, rx, ry, m.sight, 0)
    drawEye(pg, right, rx, ry, m.sight, 0)
  }
  
  pg.pop()
}

function drawVerticalAlmondTotal(pg, rx, ry, ly, maskWidth, strokeW = 0) {
  const almondWidth = rx * 0.5
  const almondHeight = ry * 1.8
  const spacing = maskWidth * 0.15
  
  const w = almondWidth + strokeW * 2
  const h = almondHeight + strokeW * 2

  for (let pos of [-spacing, 0, spacing]) {
    pg.push()
    pg.translate(pos, ly)
    
    const width = pos === 0 ? w * 1.1 : w
    const height = pos === 0 ? h : h
    
    pg.beginShape()
    pg.vertex(0, -height / 2)
    pg.bezierVertex(
      width * 0.5, -height * 0.3,
      width * 0.5, height * 0.3,
      0, height / 2
    )
    pg.bezierVertex(
      -width * 0.5, height * 0.3,
      -width * 0.5, -height * 0.3,
      0, -height / 2
    )
    pg.endShape(CLOSE)
    pg.pop()
  }
}

function drawEye(pg, c, rx, ry, type, strokeW = 0) {
  pg.push()
  pg.translate(c.x, c.y)
  pg.rectMode(CENTER)

  const hasPupil = type.includes("with Pupil") && TRAITS.count !== "Conflux"

  if (type === "Core") {
    pg.ellipse(0, 0, rx * 1.0 + strokeW * 2, ry * 2 + strokeW * 2)
    
    if (hasPupil && strokeW === 0) {
      pg.push()
      pg.fill(0, 0, 0)
      const pupilWidth = min(rx, ry) * 0.1
      const pupilHeight = ry * 1.6
      pg.ellipse(0, -ry * 0.25, pupilWidth, pupilHeight)
      pg.pop()
    }
  } else if (type === "Lune") {
    pg.push()
    const crescentRadius = ry * 0.7 + strokeW
    const cutoutRadius = ry * 0.95
    const cutoutOffset = ry * 0.4
    
    pg.beginShape()
    for (let a = 0; a <= PI; a += PI / 20) {
      pg.vertex(cos(a) * crescentRadius, sin(a) * crescentRadius - cutoutOffset)
    }
    for (let a = PI; a >= 0; a -= PI / 20) {
      pg.vertex(cos(a) * cutoutRadius, sin(a) * cutoutRadius - cutoutOffset)
    }
    pg.endShape(CLOSE)
    pg.pop()
  } else if (type === "Teardrop") {

    pg.push()
    const tearWidth = rx * 0.9 + strokeW
    const tearHeight = ry * 1.4 + strokeW
    const pointOffset = tearWidth * 0.7  
    const pointDir = c.x < 0 ? 1 : -1 
    
    pg.beginShape()
    pg.vertex(pointDir * pointOffset, 0)
    pg.bezierVertex(
      pointDir * pointOffset * 0.3, -tearHeight * 0.5,
      -pointDir * tearWidth * 0.3, -tearHeight * 0.6,
      -pointDir * tearWidth * 0.5, 0
    )
    pg.bezierVertex(
      -pointDir * tearWidth * 0.3, tearHeight * 0.6,
      pointDir * pointOffset * 0.3, tearHeight * 0.5,
      pointDir * pointOffset, 0
    )
    pg.endShape(CLOSE)
    pg.pop()

  } else if (type === "Mono") {
    const visorWidth = rx * 2.0 + strokeW * 2
    const visorHeight = ry * 0.8 + strokeW * 2
    const visorRadius = visorHeight * 0.4
    pg.rect(0, 0, visorWidth, visorHeight, visorRadius)

  } else if (type === "Echo") {
    const ovalWidth = rx * 1.2 + strokeW * 2
    const ovalHeight = ry * 0.35 + strokeW * 2
    const gap = ry * 0.5
    pg.ellipse(0, -gap, ovalWidth, ovalHeight)
    pg.ellipse(0, 0, ovalWidth * 1.1, ovalHeight)
    pg.ellipse(0, gap, ovalWidth, ovalHeight)

  } else if (type === "Slate") {
    const rectWidth = rx * 1.0 + strokeW * 2
    const rectHeight = ry * 0.4 + strokeW * 2
    const gap = ry * 0.9
    const cornerRadius = rectHeight
    pg.rect(0, -gap, rectWidth, rectHeight, cornerRadius)
    pg.rect(0, 0, rectWidth * 1.0, rectHeight, rectHeight * 1.0)
    pg.rect(0, gap, rectWidth, rectHeight, rectHeight * 0.5)

  } else if (type === "Helix") {
    const segments = 5
    const segWidth = rx * 0.33 + strokeW * 2
    const totalHeight = ry * 1.6
    const segHeight = totalHeight / segments + strokeW * 2
    const gap = segHeight * 0.1
    for (let i = 0; i < segments; i++) {
      const y = (i - (segments - 1) / 2) * (totalHeight / segments)
      pg.ellipse(0, y, segWidth, segHeight - gap)
    }
  } else if (type === "Signal") {
    const dashes = 3
    const dashWidth = rx * 1.2 / dashes + strokeW * 2
    const dashHeight = ry * 0.6 + strokeW * 2
    const gap = dashWidth * 0.25
    for (let i = 0; i < dashes; i++) {
      const x = (i - (dashes - 1) / 2) * (rx * 1.2 / dashes)
      pg.rect(x, 0, dashWidth - gap, dashHeight, dashHeight * 0.2)
    }
  } else if (type === "Pierce") {
    const dots = 1
    const dotSize = min(rx, ry) * 0.7 + strokeW * 2
    const spacing = rx * 0.5
    for (let i = 0; i < dots; i++) {
      const x = (i - (dots - 1) / 2) * spacing
      pg.circle(x, 0, dotSize)
    }
  } else if (type === "Cross") {
    const crossWidth = rx * 0.3 + strokeW * 2
    const crossHeight = ry * 1.6 + strokeW * 2
    pg.rect(0, 0, crossWidth, crossHeight)
    pg.rect(0, 0, crossHeight * 0.6, crossWidth)

  } else if (type === "Cut") {
    const slitCount = 3
    const slitWidth = rx * 1.2 + strokeW * 2
    const slitHeight = ry * 0.15 + strokeW * 2
    const gap = ry * 0.5
    for (let i = 0; i < slitCount; i++) {
      const y = (i - (slitCount - 1) / 2) * gap
      pg.rect(0, y, slitWidth, slitHeight)
    }
  }

  else {
    pg.rect(0, 0, rx * 1.2 + strokeW * 2, ry * 0.4 + strokeW * 2, ry * 0.2)
  }
  pg.pop()
}

function carveMouth(pg, m) {
  const y = m.h * 0.22
  
  if (TRAITS.count === "Conflux") {
    pg.push()
    const translateX = m.maskIndex === 0 ? m.w * 0.18 : -m.w * 0.18
    pg.translate(translateX, 0)
  }
  
  pg.rectMode(CENTER)

  if (m.voice === "Still") {
    pg.rect(0, y, m.w * 0.35, m.h * 0.03)

  } else if (m.voice === "Prowl") {
    pg.ellipse(0, y, m.w * 0.09, m.h * 0.4)

  } else if (m.voice === "Forge") {
    pg.rect(0, y, m.w * 0.28, m.h * 0.06, m.h * 0.01)

  } else if (m.voice === "Sunder") {
    const segmentCount = 4
    const totalWidth = m.w * 0.25
    const segmentWidth = totalWidth / segmentCount
    const segmentHeight = m.h * 0.04
    const gap = segmentWidth * 0.15
    for (let i = 0; i < segmentCount; i++) {
      const x = (i - (segmentCount - 1) / 2) * segmentWidth
      pg.rect(x, y, segmentWidth - gap, segmentHeight, segmentHeight * 0.1)
    }
  } else if (m.voice === "Hollow") {
    pg.rect(0, y, m.w * 0.35, m.h * 0.02)

  } else if (m.voice === "Devour") {
    pg.beginShape()
    const points = 12
    const width = m.w * 0.4
    const height = m.h * 0.1
    for (let i = 0; i <= points; i++) {
      const x = map(i, 0, points, -width / 2, width / 2)
      const yOffset = (i % 2 === 0) ? -height / 2 : height / 2
      pg.vertex(x, y + yOffset)
    }
    pg.endShape()
    pg.strokeWeight(m.h * 0.01)
    pg.noFill()
    pg.beginShape()
    for (let i = 0; i <= points; i++) {
      const x = map(i, 0, points, -width / 2, width / 2)
      const yOffset = (i % 2 === 0) ? -height / 2 : height / 2
      pg.vertex(x, y + yOffset)
    }
    pg.endShape()
    pg.noStroke()
    pg.fill(255)

  } else if (m.voice === "Viper") {
    const fangWidth = m.w * 0.06
    const fangHeight = m.h * 0.08
    const fangSpacing = m.w * 0.15
    
    pg.push()
    pg.translate(-fangSpacing, y)
    pg.triangle(0, fangHeight, -fangWidth / 2, 0, fangWidth / 2, 0)
    pg.pop()
    
    pg.push()
    pg.translate(fangSpacing, y)
    pg.triangle(0, fangHeight, -fangWidth / 2, 0, fangWidth / 2, 0)
    pg.pop()

  } else if (m.voice === "Bind") {
    const mouthWidth = m.w * 0.35
    const mouthHeight = m.h * 0.015
    pg.rect(0, y, mouthWidth, mouthHeight)
    
    const stitchCount = 6
    const stitchHeight = m.h * 0.03
    const stitchWidth = m.w * 0.01
    for (let i = 0; i < stitchCount; i++) {
      const x = (i - (stitchCount - 1) / 2) * (mouthWidth / (stitchCount - 1))
      pg.rect(x, y, stitchWidth, stitchHeight)
    }
  } else if (m.voice === "Downfall") {
    pg.rect(0, y, m.w * 0.25, m.h * 0.015)

  } else if (m.voice === "Stun") {
    const mouthWidth = m.h * 0.12
    const mouthHeight = m.h * 0.06
    
    pg.push()
    pg.translate(0, y + mouthHeight)
    pg.beginShape()
    for (let a = PI; a <= TWO_PI; a += PI / 20) {
      const x = cos(a) * mouthWidth / 2
      const yOffset = sin(a) * mouthHeight
      pg.vertex(x, yOffset)
    }
    pg.vertex(mouthWidth / 2, 0)
    pg.vertex(-mouthWidth / 2, 0)
    pg.endShape(CLOSE)
    pg.pop()
  } else if (m.voice === "Grate") {
    const barCount = 4
    const barWidth = m.w * 0.3
    const barHeight = m.h * 0.03
    const spacing = m.h * 0.04
    
    for (let i = 0; i < barCount; i++) {
      const barY = y + (i - (barCount - 1) / 2) * spacing
      pg.rect(0, barY, barWidth, barHeight)
    }
  } else if (m.voice === "Ease") {
    pg.push()
    pg.translate(0, y)
    const waveWidth = m.w * 0.4
    const waveHeight = m.h * 0.025
    
    pg.beginShape()
    const steps = 30
    for (let i = 0; i <= steps; i++) {
      const t = i / steps
      const x = map(t, 0, 1, -waveWidth / 2, waveWidth / 2)
      const waveY = sin(t * PI * 3) * waveHeight
      pg.vertex(x, waveY)
    }
    for (let i = steps; i >= 0; i--) {
      const t = i / steps
      const x = map(t, 0, 1, -waveWidth / 2, waveWidth / 2)
      const waveY = sin(t * PI * 3) * waveHeight + m.h * 0.015
      pg.vertex(x, waveY)
    }
    pg.endShape(CLOSE)
    pg.pop()
  } else {
    pg.rect(0, y, m.w * 0.45, m.h * 0.018)
  }
  
  if (TRAITS.count === "Conflux") {
    pg.pop()
  }
}

function carveNose(pg, m) {
  if (m.scent === "Sealed") return

  const y = m.h * 0.05 + 20  

  if (TRAITS.count === "Conflux") {
    pg.push()
    const translateX = m.maskIndex === 0 ? m.w * 0.18 : -m.w * 0.18
    pg.translate(translateX, 0)
  }
  
  pg.rectMode(CENTER)

  if (m.scent === "Aero") {
    pg.rect(0, y, m.w * 0.05, m.h * 0.07)
  } else if (m.scent === "Sego") {
    const segments = 3
    const totalHeight = m.h * 0.12
    const segHeight = totalHeight / segments
    const gap = segHeight * 0.25

    for (let i = 0; i < segments; i++) {
      const segY = y + (i - (segments - 1) / 2) * segHeight
      pg.rect(0, segY, m.w * 0.05, segHeight - gap)
    }
  } else if (m.scent === "Duos") {
    const dotSize = m.w * 0.025
    const spacing = m.w * 0.04
    pg.circle(-spacing / 2, y, dotSize)
    pg.circle(spacing / 2, y, dotSize)
  } else if (m.scent === "Jewel") {
    pg.push()
    pg.translate(0, y)
    const size = m.w * 0.04
    pg.quad(0, -size, size, 0, 0, size, -size, 0)
    pg.pop()
  } else if (m.scent === "Dot") {
    const dotSize = m.w * 0.03
    pg.circle(0, y, dotSize)

  } else if (m.scent === "Aexo") {
    pg.push()
    pg.translate(0, y)
    pg.triangle(0, m.h * 0.04, -m.w * 0.03, -m.h * 0.04, m.w * 0.03, -m.h * 0.04)
    pg.pop()
  } else if (m.scent === "Tri") {
    const dotSize = m.w * 0.02
    const spacing = m.h * 0.04
    pg.circle(0, y - spacing, dotSize)
    pg.circle(0, y, dotSize)
    pg.circle(0, y + spacing, dotSize)
  }
  
  if (TRAITS.count === "Conflux") {
    pg.pop()
  }
}

function carveCutouts(pg, m) {
  if (m.hollows === "Whole") return

  if (m.hollows === "Cleave") {
    if (TRAITS.count === "Conflux") {
      const isLeftMask = m.x < width / 2
      if (isLeftMask) {
        pg.ellipse(-m.w * 0.28, m.h * 0.08, m.w * 0.08, m.h * 0.08)
      } else {
        pg.ellipse(m.w * 0.28, m.h * 0.08, m.w * 0.08, m.h * 0.08)
      }
    } else {
      pg.ellipse(-m.w * 0.28, m.h * 0.08, m.w * 0.08, m.h * 0.08)
      pg.ellipse(m.w * 0.28, m.h * 0.08, m.w * 0.08, m.h * 0.08)
    }
  } else if (m.hollows === "Mark") {
    pg.ellipse(0, -m.h * 0.32, m.w * 0.08, m.h * 0.08)
  } else if (m.hollows === "Maw") {
    pg.rectMode(CENTER)
    
    const hollowX = m.w * 0.30
    const hollowY = m.h * 0.18
    const hollowWidth = m.w * 0.18
    const hollowHeight = m.h * 0.28
    
    if (TRAITS.count === "Conflux") {
      const isLeftMask = m.maskIndex === 0
      
      if (isLeftMask) {
        pg.push()
        pg.translate(-hollowX, hollowY)
        pg.beginShape()
        pg.vertex(-hollowWidth * 0.35, -hollowHeight * 0.5)
        pg.vertex(hollowWidth * 0.35, -hollowHeight * 0.5)
        pg.bezierVertex(
          hollowWidth * 0.45, -hollowHeight * 0.2,
          hollowWidth * 0.5, hollowHeight * 0.2,
          hollowWidth * 0.4, hollowHeight * 0.5
        )
        pg.vertex(-hollowWidth * 0.4, hollowHeight * 0.5)
        pg.bezierVertex(
          -hollowWidth * 0.5, hollowHeight * 0.2,
          -hollowWidth * 0.45, -hollowHeight * 0.2,
          -hollowWidth * 0.35, -hollowHeight * 0.5
        )
        pg.endShape(CLOSE)
        pg.pop()
      } else {
        pg.push()
        pg.translate(hollowX, hollowY)
        pg.beginShape()
        pg.vertex(-hollowWidth * 0.35, -hollowHeight * 0.5)
        pg.vertex(hollowWidth * 0.35, -hollowHeight * 0.5)
        pg.bezierVertex(
          hollowWidth * 0.45, -hollowHeight * 0.2,
          hollowWidth * 0.5, hollowHeight * 0.2,
          hollowWidth * 0.4, hollowHeight * 0.5
        )
        pg.vertex(-hollowWidth * 0.4, hollowHeight * 0.5)
        pg.bezierVertex(
          -hollowWidth * 0.5, hollowHeight * 0.2,
          -hollowWidth * 0.45, -hollowHeight * 0.2,
          -hollowWidth * 0.35, -hollowHeight * 0.5
        )
        pg.endShape(CLOSE)
        pg.pop()
      }
    } else {
      pg.push()
      pg.translate(-hollowX, hollowY)
      pg.beginShape()
      pg.vertex(-hollowWidth * 0.35, -hollowHeight * 0.5)
      pg.vertex(hollowWidth * 0.35, -hollowHeight * 0.5)
      pg.bezierVertex(
        hollowWidth * 0.45, -hollowHeight * 0.2,
        hollowWidth * 0.5, hollowHeight * 0.2,
        hollowWidth * 0.4, hollowHeight * 0.5
      )
      pg.vertex(-hollowWidth * 0.4, hollowHeight * 0.5)
      pg.bezierVertex(
        -hollowWidth * 0.5, hollowHeight * 0.2,
        -hollowWidth * 0.45, -hollowHeight * 0.2,
        -hollowWidth * 0.35, -hollowHeight * 0.5
      )
      pg.endShape(CLOSE)
      pg.pop()
      
      pg.push()
      pg.translate(hollowX, hollowY)
      pg.beginShape()
      pg.vertex(-hollowWidth * 0.35, -hollowHeight * 0.5)
      pg.vertex(hollowWidth * 0.35, -hollowHeight * 0.5)
      pg.bezierVertex(
        hollowWidth * 0.45, -hollowHeight * 0.2,
        hollowWidth * 0.5, hollowHeight * 0.2,
        hollowWidth * 0.4, hollowHeight * 0.5
      )
      pg.vertex(-hollowWidth * 0.4, hollowHeight * 0.5)
      pg.bezierVertex(
        -hollowWidth * 0.5, hollowHeight * 0.2,
        -hollowWidth * 0.45, -hollowHeight * 0.2,
        -hollowWidth * 0.35, -hollowHeight * 0.5
      )
      pg.endShape(CLOSE)
      pg.pop()
    }
  }
}

function drawOrnaments(pg, m) {
  if (m.ornament === "Bare") return

  pg.push()
  pg.noStroke()
  pg.fill(255)

  if (m.ornament === "Links") {
    const earringSize = m.w * 0.08
    const earringX = m.w * 0.40
    const earringY = m.h * 0.15
    
    pg.circle(-earringX, earringY, earringSize)
    pg.circle(earringX, earringY, earringSize)
    
    const smallSize1 = earringSize * 0.65
    const smallSize2 = earringSize * 0.5
    const smallSize3 = earringSize * 0.35
    const dropSpacing = earringSize * 0.55
    
    pg.circle(-earringX, earringY + dropSpacing, smallSize1)
    pg.circle(-earringX, earringY + dropSpacing * 1.8, smallSize2)
    pg.circle(-earringX, earringY + dropSpacing * 2.5, smallSize3)
    
    pg.circle(earringX, earringY + dropSpacing, smallSize1)
    pg.circle(earringX, earringY + dropSpacing * 1.8, smallSize2)
    pg.circle(earringX, earringY + dropSpacing * 2.5, smallSize3)

  } else if (m.ornament === "Amp") {
    pg.rectMode(CENTER)
    const markWidth = m.w * 0.03
    const markHeight = m.h * 0.15
    const markX = m.w * 0.38
    const markY = 0
    pg.rect(-markX, markY, markWidth, markHeight)
    pg.rect(markX, markY, markWidth, markHeight)

  } else if (m.ornament === "Crest") {
    const spikeCount = 5
    const baseWidth = m.w * 0.1
    const spacing = m.w * 0.15
    const maskTopY = -m.h * 0.4

    const heights = [
      m.h * 0.16,
      m.h * 0.22,
      m.h * 0.26,
      m.h * 0.22,
      m.h * 0.16
    ]
    
    const verticalOffsets = [50, 0, 0, 0, 50]

    pg.stroke(0, 0, 0)
    pg.strokeWeight(m.w * 0.015)

    for (let i = 0; i < spikeCount; i++) {
      const x = (i - (spikeCount - 1) / 2) * spacing
      const spikeHeight = heights[i]
      const baseY = maskTopY + verticalOffsets[i]
      const spikeY = baseY - spikeHeight

      const isOuter = (i === 0 || i === spikeCount - 1)
      const angleOffset = isOuter ? (i === 0 ? baseWidth * 0.3 : -baseWidth * 0.3) : 0

      pg.triangle(
        x, spikeY,
        x - baseWidth / 2 + (i === 0 ? angleOffset : 0), baseY,
        x + baseWidth / 2 + (i === spikeCount - 1 ? angleOffset : 0), baseY
      )

      const connectorHeight = m.h * 0.10
      const topWidth = baseWidth * 0.9
      const bottomWidth = baseWidth * 0.6

      pg.beginShape()
      pg.vertex(x - baseWidth / 2 + (i === 0 ? angleOffset : 0), baseY)
      pg.vertex(x + baseWidth / 2 + (i === spikeCount - 1 ? angleOffset : 0), baseY)
      pg.vertex(x + bottomWidth / 2, baseY + connectorHeight)
      pg.vertex(x - bottomWidth / 2, baseY + connectorHeight)
      pg.endShape(CLOSE)
    }
    
    pg.noStroke()
  } else if (m.ornament === "Bestia") {

    if (TRAITS.paletteName === "Doomed") {
      pg.fill(0, 0, 50)
    } else {
      pg.fill(0, 0, 10)
    }
    
    const hornBaseY = -m.h * 0.25
    const hornSpacing = m.w * 0.15
    const hornHeight = m.h * 0.35
    const hornWidth = m.w * 0.12
    
    // Draw both horns using scale to mirror
    for (let side of [-1, 1]) {
      pg.push()
      pg.translate(hornSpacing * side, hornBaseY)
      pg.scale(side, 1)
      pg.rotate(-0.25)
      
      pg.beginShape()
      pg.vertex(hornWidth * 0.3, 0)
      pg.vertex(-hornWidth * 0.3, 0)

      pg.bezierVertex(
        -hornWidth * 0.5, -hornHeight * 0.15,
        -hornWidth * 0.7, -hornHeight * 0.25,
        -hornWidth * 0.6, -hornHeight * 0.35
      )

      pg.vertex(-hornWidth * 0.9, -hornHeight * 0.32)
      pg.vertex(-hornWidth * 0.55, -hornHeight * 0.45)

      pg.bezierVertex(
        -hornWidth * 0.65, -hornHeight * 0.55,
        -hornWidth * 0.6, -hornHeight * 0.65,
        -hornWidth * 0.45, -hornHeight * 0.72
      )

      pg.vertex(-hornWidth * 0.75, -hornHeight * 0.70)
      pg.vertex(-hornWidth * 0.35, -hornHeight * 0.82)

      pg.bezierVertex(
        -hornWidth * 0.3, -hornHeight * 0.92,
        -hornWidth * 0.1, -hornHeight * 0.98,
        hornWidth * 0.05, -hornHeight
      )

      pg.bezierVertex(
        hornWidth * 0.15, -hornHeight * 0.75,
        hornWidth * 0.2, -hornHeight * 0.45,
        hornWidth * 0.3, 0
      )
      pg.endShape(CLOSE)
      pg.pop()
    }
  }

  else if (m.ornament === "Root") {
  const tuskWidth = m.w * 0.15
  const tuskHeight = m.h * 0.4
  const tuskSpacing = m.w * 0.20
  const tuskY = m.h * 0.22
  
  pg.push()
  pg.translate(-tuskSpacing, tuskY)
  pg.beginShape()
  pg.vertex(-tuskWidth * 0.35, 0)
  pg.bezierVertex(
    -tuskWidth * 0.25, tuskHeight * 0.6,
    -tuskWidth * 0.05, tuskHeight * 0.8,
    0, tuskHeight
  )
  pg.bezierVertex(
    tuskWidth * 0.35, tuskHeight * 0.8,
    tuskWidth * 0.5, tuskHeight * 0.6,
    tuskWidth * 0.05, 0
  )
  pg.endShape(CLOSE)
  pg.pop()
  
  pg.push()
  pg.translate(tuskSpacing, tuskY)
  pg.beginShape()
  pg.vertex(-tuskWidth * 0.35, 0)
  pg.bezierVertex(
    -tuskWidth * 0.25, tuskHeight * 0.6,
    -tuskWidth * 0.15, tuskHeight * 0.8,
    0, tuskHeight
  )
  pg.bezierVertex(
    tuskWidth * 0.15, tuskHeight * 0.8,
    tuskWidth * 0.25, tuskHeight * 0.6,
    tuskWidth * 0.35, 0
  )
  pg.endShape(CLOSE)
  pg.pop()
}

  else if (m.ornament === "Gauge") {
    const gaugeSize = m.w * 0.12
    const gaugeX = m.w * 0.42
    const gaugeY = m.h * 0.12
    
    pg.circle(-gaugeX, gaugeY, gaugeSize)
    pg.circle(gaugeX, gaugeY, gaugeSize)
    
    pg.push()
    pg.erase()
    const holeSize = gaugeSize * 0.5
    pg.circle(-gaugeX, gaugeY, holeSize)
    pg.circle(gaugeX, gaugeY, holeSize)
    pg.noErase()
    pg.pop()
  }

  else if (m.ornament === "Thorns") {
    const spikeCount = 3
    const spikeWidth = m.w * 0.05
    const spikeHeight = m.h * 0.08
    const earX = m.w * 0.42
    const startY = m.h * 0.05
    const spacing = m.h * 0.1
    
    for (let side of [-1, 1]) {
      for (let i = 0; i < spikeCount; i++) {
        const x = earX * side
        const y = startY + i * spacing
        
        pg.push()
        pg.translate(x, y)
        pg.triangle(
          0, -spikeHeight * 0.5,
          -spikeWidth * 0.5 * side, spikeHeight * 0.5,
          spikeWidth * 0.5 * side, spikeHeight * 0.5
        )
        pg.pop()
      }
    }
  }

  else if (m.ornament === "Tandem") {
    const earringSize = m.w * 0.06
    const earringX = m.w * 0.44
    const earringY1 = m.h * 0.10
    const earringY2 = m.h * 0.20
    
    pg.circle(-earringX, earringY1, earringSize)
    pg.circle(earringX, earringY1, earringSize)
    pg.circle(-earringX, earringY2, earringSize * 0.8)
    pg.circle(earringX, earringY2, earringSize * 0.8)
  }

  else if (m.ornament === "Spike") {
    const spikeWidth = m.w * 0.12
    const spikeHeight = m.h * 0.22
    const chinY = m.h * 0.32
    
    pg.push()
    pg.translate(0, chinY)
    pg.triangle(
      -spikeWidth / 2, 0,
      spikeWidth / 2, 0,
      0, spikeHeight
    )
    pg.pop()
  }

  pg.pop()
}

/* ========================= OPTIMIZED ASCII SHADER ========================= */

const vertSrc = `
attribute vec3 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;

void main() {
  vTexCoord = vec2(aTexCoord.x, 1.0 - aTexCoord.y);
  vec4 positionVec4 = vec4(aPosition, 1.0);
  positionVec4.xy = positionVec4.xy * 2.0 - 1.0;
  gl_Position = positionVec4;
}
`;

const fragDigitalStitchOptimized = `
#ifdef GL_ES
precision mediump float;
#endif

varying vec2 vTexCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform sampler2D u_texture;
uniform float u_gridX;
uniform bool u_forceMonochrome;
uniform bool u_applyNoise;
uniform float u_symbolOffset;
uniform float u_symbolSize;

float hash21(vec2 p){
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

// Simple 2D Perlin-style noise function
float noise2D(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  
  // Smooth interpolation
  f = f * f * (3.0 - 2.0 * f);
  
  // Four corners
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  
  // Bilinear interpolation
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// Convert RGB to HSB
vec3 rgb2hsb(vec3 c) {
  vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  float e = 1.0e-10;
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
}

// Convert HSB to RGB
vec3 hsb2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float getCharPattern(float shapeId, vec2 cellUV, float brightness){
  vec2 p = (cellUV - 0.5) / u_symbolSize;  // Scale: larger u_symbolSize = larger symbols
  int id = int(shapeId);
  
  // Binary search branching: max ~6 checks instead of 52
  if (id < 26) {
    if (id < 13) {
      if (id < 7) {
        if (id < 4) {
          if (id == 0) return step(abs(p.y), 0.28); // Horizontal bar
          if (id == 1) return step(abs(p.x), 0.28); // Vertical bar
          if (id == 2) return step(length(p), 0.48); // Filled circle
          return step(max(abs(p.x), abs(p.y)), 0.45); // 3: Square
        } else {
          if (id == 4) return step(abs(p.x) + abs(p.y), 0.65); // Diamond
          if (id == 5) return max(step(abs(p.y), 0.22), step(abs(p.x), 0.22)); // Thick cross
          float ring = length(p); return step(ring, 0.48) * (1.0 - step(ring, 0.12)); // 6: Ring
        }
      } else {
        if (id < 10) {
          if (id == 7) return mod(floor(cellUV.x*2.0) + floor(cellUV.y*2.0), 2.0); // Checkerboard
          if (id == 8) return step(length(p), 0.38); // Small circle
          return step(abs(abs(p.x) - abs(p.y)), 0.18); // 9: X
        } else {
          if (id == 10) { vec2 corner = abs(p) - vec2(0.22); return step(length(corner), 0.22); } // Rounded quad
          if (id == 11) return max(step(abs(p.y), 0.18), step(abs(p.x), 0.18)); // Thin cross
          // 12: Heart
          vec2 h = p * 3.0; h.y += 0.2;
          float l = length(h - vec2(-0.3, 0.0)); float r = length(h - vec2(0.3, 0.0));
          return min(step(l, 0.5) + step(r, 0.5) + step(h.y + abs(h.x) * 0.8, 0.5), 1.0);
        }
      }
    } else {
      if (id < 20) {
        if (id < 17) {
          if (id == 13) { float a = atan(p.y, p.x); float r = length(p); return step(r, abs(cos(a * 2.5)) * 0.15 + 0.25); } // 5-petal flower
          if (id == 14) return step(abs(p.x) * 0.577 + p.y, 0.25) * step(-p.y, 0.35); // Triangle up
          if (id == 15) return step(abs(p.x) * 0.577 - p.y, 0.25) * step(p.y, 0.35); // Triangle down
          // 16: Arrow up
          float shaft = step(abs(p.x), 0.1) * step(p.y + 0.2, 0.3);
          float head = step(abs(p.x) - p.y - 0.15, 0.0) * step(p.y, 0.15);
          return max(shaft, head);
        } else {
          if (id == 17) { // Arrow right
            float shaft = step(abs(p.y), 0.1) * step(-p.x + 0.2, 0.3);
            float head = step(abs(p.y) + p.x - 0.15, 0.0) * step(-p.x, 0.15);
            return max(shaft, head);
          }
          if (id == 18) { vec2 q = abs(p); return step(q.x * 0.866 + q.y * 0.5, 0.4); } // Hexagon
          return step(length(p), 0.12); // 19: Dot
        }
      } else {
        if (id < 23) {
          if (id == 20) return max(step(length(p - vec2(-0.15, 0.0)), 0.15), step(length(p - vec2(0.15, 0.0)), 0.15)); // Two circles
          if (id == 21) return max(step(0.7, fract(cellUV.x * 3.0)), step(0.7, fract(cellUV.y * 3.0))); // Grid
          return step(0.7, fract((cellUV.x + cellUV.y) * 5.0)); // 22: Diagonal /
        } else {
          if (id == 23) return step(0.7, fract((cellUV.x - cellUV.y) * 5.0)); // Diagonal backslash
          if (id == 24) { // Cross with dots
            float plus = max(step(abs(p.y), 0.12), step(abs(p.x), 0.12));
            float dots = step(length(p - vec2(0.3, 0.3)), 0.08) + step(length(p - vec2(-0.3, 0.3)), 0.08) +
                         step(length(p - vec2(0.3, -0.3)), 0.08) + step(length(p - vec2(-0.3, -0.3)), 0.08);
            return min(plus + dots, 1.0);
          }
          // 25: Four corner dots
          return max(max(step(length(p - vec2(-0.2, -0.2)), 0.15), step(length(p - vec2(0.2, -0.2)), 0.15)),
                     max(step(length(p - vec2(-0.2, 0.2)), 0.15), step(length(p - vec2(0.2, 0.2)), 0.15)));
        }
      }
    }
  } else {
    if (id < 39) {
      if (id < 33) {
        if (id < 30) {
          if (id == 26) { // Quincunx
            float center = step(length(p), 0.15);
            float pts = step(length(p - vec2(0.0, 0.25)), 0.12) + step(length(p - vec2(0.25, 0.0)), 0.12) +
                        step(length(p - vec2(0.0, -0.25)), 0.12) + step(length(p - vec2(-0.25, 0.0)), 0.12);
            return min(center + pts, 1.0);
          }
          if (id == 27) { vec2 q = abs(p); return step(max(q.x * 0.707 + q.y * 0.707, max(q.x, q.y)), 0.4); } // Octagon
          if (id == 28) return step(0.6, fract(cellUV.x * 4.0)); // Vertical stripes
          return step(0.6, fract(cellUV.y * 4.0)); // 29: Horizontal stripes
        } else {
          if (id == 30) { float r = length(p); return step(0.7, fract(r * 10.0)); } // Concentric rings
          if (id == 31) { float outer = step(length(p), 0.38); float inner = step(length(p - vec2(0.18, 0.0)), 0.32); return outer * (1.0 - inner); } // Crescent
          // 32: 5-pointed star
          float a = atan(p.y, p.x) + 1.5708; float r = length(p);
          return step(r, cos(floor(0.5 + a / 1.2566) * 1.2566 - a) * 0.45);
        }
      } else {
        if (id < 36) {
          if (id == 33) { // 6-pointed star
            float up = step(abs(p.x) * 0.577 + p.y, 0.28) * step(-p.y, 0.32);
            float down = step(abs(p.x) * 0.577 - p.y, 0.28) * step(p.y, 0.32);
            return max(up, down);
          }
          if (id == 34) { // Crown
            float base = step(abs(p.x), 0.32) * step(abs(p.y + 0.18), 0.12);
            float pts = step(length(p - vec2(-0.22, 0.18)), 0.1) + step(length(p - vec2(0.0, 0.28)), 0.1) + step(length(p - vec2(0.22, 0.18)), 0.1);
            float body = step(abs(p.x), 0.28) * step(abs(p.y), 0.12);
            return min(base + pts + body, 1.0);
          }
          // 35: Rook
          float body = step(abs(p.x), 0.22) * step(abs(p.y), 0.32);
          float notch1 = step(abs(p.x + 0.12), 0.04) * step(p.y, 0.35) * step(0.22, p.y);
          float notch2 = step(abs(p.x - 0.12), 0.04) * step(p.y, 0.35) * step(0.22, p.y);
          return body * (1.0 - notch1) * (1.0 - notch2);
        } else {
          if (id == 36) { // Pawn
            float head = step(length(p - vec2(0.0, 0.18)), 0.14);
            float neck = step(abs(p.x), 0.06) * step(abs(p.y - 0.02), 0.12);
            float base = step(abs(p.x), 0.18) * step(abs(p.y + 0.24), 0.1);
            return min(head + neck + base, 1.0);
          }
          if (id == 37) { // Saturn
            float planet = step(length(p), 0.18);
            float ring = step(abs(p.y), 0.05) * step(abs(p.x), 0.38) * (1.0 - step(abs(p.x), 0.2));
            return min(planet + ring, 1.0);
          }
          // 38: Anchor
          float stem = step(abs(p.x), 0.06) * step(p.y, 0.28) * step(-0.28, p.y);
          float top = step(length(p - vec2(0.0, 0.32)), 0.08);
          float bar = step(abs(p.y - 0.18), 0.04) * step(abs(p.x), 0.14);
          float hookL = step(length(p - vec2(-0.16, -0.28)), 0.12) * (1.0 - step(length(p - vec2(-0.16, -0.28)), 0.05));
          float hookR = step(length(p - vec2(0.16, -0.28)), 0.12) * (1.0 - step(length(p - vec2(0.16, -0.28)), 0.05));
          return min(stem + top + bar + hookL + hookR, 1.0);
        }
      }
    } else {
      if (id < 46) {
        if (id < 43) {
          if (id == 39) { // Lightning
            vec2 q = p * 2.5;
            float b1 = step(abs(q.x - 0.2), 0.18) * step(q.y, 0.8) * step(0.0, q.y);
            float b2 = step(abs(q.x + 0.1), 0.25) * step(q.y, 0.15) * step(-0.15, q.y);
            float b3 = step(abs(q.x + 0.2), 0.18) * step(q.y, -0.0) * step(-0.8, q.y);
            return min(b1 + b2 + b3, 1.0);
          }
          if (id == 40) { float w = 0.28 - abs(p.y) * 0.7; return step(abs(p.x), max(w, 0.04)) * step(abs(p.y), 0.38); } // Hourglass
          if (id == 41) { // Infinity
            float l1 = length(p - vec2(-0.18, 0.0)); float l2 = length(p - vec2(0.18, 0.0));
            return max(step(l1, 0.2) * (1.0 - step(l1, 0.08)), step(l2, 0.2) * (1.0 - step(l2, 0.08)));
          }
          // 42: Spiral
          float a = atan(p.y, p.x); float r = length(p);
          return step(abs(r - (a + 3.14159) * 0.055), 0.045) * step(r, 0.38);
        } else {
          if (id == 43) { float almond = step(abs(p.x) * 0.5 + abs(p.y), 0.22); return max(almond * 0.7, step(length(p), 0.08)); } // Eye
          if (id == 44) { // Skull
            float head = step(length(p - vec2(0.0, 0.08)), 0.26);
            float jaw = step(abs(p.x), 0.14) * step(abs(p.y + 0.2), 0.1);
            float eyeL = 1.0 - step(length(p - vec2(-0.09, 0.12)), 0.07);
            float eyeR = 1.0 - step(length(p - vec2(0.09, 0.12)), 0.07);
            return min(head + jaw, 1.0) * eyeL * eyeR;
          }
          // 45: Spade
          vec2 q = vec2(abs(p.x), -p.y);
          float lobe = step(length(q - vec2(0.12, -0.05)), 0.18);
          float point = step(q.x * 0.7, 0.18 - q.y) * step(q.y, 0.05);
          float stem = step(abs(p.x), 0.05) * step(-p.y, 0.38) * step(p.y, -0.12);
          return min(lobe + point + stem, 1.0);
        }
      } else {
        if (id < 49) {
          if (id == 46) { // Club
            float c1 = step(length(p - vec2(0.0, 0.14)), 0.13);
            float c2 = step(length(p - vec2(-0.13, -0.04)), 0.13);
            float c3 = step(length(p - vec2(0.13, -0.04)), 0.13);
            float stem = step(abs(p.x), 0.05) * step(-p.y, 0.38) * step(p.y, -0.1);
            return min(c1 + c2 + c3 + stem, 1.0);
          }
          if (id == 47) { // Trefoil
            float c1 = step(length(p - vec2(0.0, 0.15)), 0.14);
            float c2 = step(length(p - vec2(-0.13, -0.05)), 0.14);
            float c3 = step(length(p - vec2(0.13, -0.05)), 0.14);
            return min(c1 + c2 + c3, 1.0);
          }
          // 48: Peace sign
          float r = length(p);
          float ring = step(r, 0.35) * (1.0 - step(r, 0.26));
          float vert = step(abs(p.x), 0.045) * step(abs(p.y), 0.35);
          float legL = step(abs(p.x + p.y * 0.65), 0.045) * step(-p.y, 0.35) * step(p.y, 0.0);
          float legR = step(abs(p.x - p.y * 0.65), 0.045) * step(-p.y, 0.35) * step(p.y, 0.0);
          return min(ring + vert + legL + legR, 1.0);
        } else {
          if (id == 49) { float a = atan(p.y, p.x); return step(abs(sin(a * 3.0)), 0.18) * step(length(p), 0.36); } // Asterisk
          if (id == 50) { // Snowflake
            float a = atan(p.y, p.x); float r = length(p);
            float ray = step(abs(sin(a * 3.0)), 0.1) * step(r, 0.36);
            float dots = step(length(p - vec2(0.0, 0.22)), 0.06) + step(length(p - vec2(0.19, -0.11)), 0.06) + step(length(p - vec2(-0.19, -0.11)), 0.06);
            return min(ray + dots, 1.0);
          }
          // 51: Musical note
          float head = step(length(p - vec2(-0.08, -0.18)), 0.14);
          float stem = step(abs(p.x - 0.06), 0.035) * step(p.y, 0.28) * step(-0.18, p.y);
          float flag = step(abs(p.y - 0.18 - (p.x - 0.06) * 0.8), 0.05) * step(p.x, 0.26) * step(0.06, p.x);
          return min(head + stem + flag, 1.0);
        }
      }
    }
  }
  
  return step(max(abs(p.x), abs(p.y)), 0.2);
}

void main(){
  vec2 uv = vTexCoord;
  
  float GRID_X = max(20.0, u_gridX);
  float aspect = u_resolution.x / u_resolution.y;
  vec2 gridCount = vec2(GRID_X, GRID_X / aspect);
  vec2 gridUV = uv * gridCount;
  vec2 cellID = floor(gridUV);
  
  vec2 cellUV = fract(gridUV);
  
  vec2 cellCenter = (cellID + 0.5) / gridCount;
  
  vec4 cellColor = texture2D(u_texture, cellCenter);
  
  if (cellColor.a < 0.01) {
    gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
    return;
  }
  
  // Enhanced brightness calculation with better contrast
  float cellBri = dot(cellColor.rgb, vec3(0.299, 0.587, 0.114));
  cellBri = pow(cellBri, 0.8); // Gamma adjustment for better distribution
  
  // Conditionally apply Perlin noise texture
  // Slow-moving organic texture across the surface
  if (u_applyNoise) {
    vec2 noiseCoord = cellCenter * u_resolution * 0.003 + u_time * 0.05;
    float noiseVal = noise2D(noiseCoord);
    
    // Apply subtle noise variation to brightness (affects pattern selection)
    cellBri = cellBri + (noiseVal - 0.5) * 0.12;
  }
  cellBri = clamp(cellBri, 0.0, 1.0);
  
  // Symbol selection - offset is set once per sketch from seed
  // This preserves unified swatches of same symbol at same brightness
  float TYPES = 52.0;
  
  float base = floor(cellBri * TYPES);
  float shapeId = mod(base + u_symbolOffset, TYPES);
  
  // Get the pattern mask
  float mask = getCharPattern(shapeId, cellUV, cellBri);
  mask = clamp(mask, 0.0, 1.0);
  
  // Convert cell color to HSB
  vec3 hsbColor = rgb2hsb(cellColor.rgb);
  
  // Check if this is a grayscale/desaturated color (like the form)
  float isGrayscale = step(hsbColor.y, 0.30); // Saturation threshold
  
  // OVERRIDE: Force monochrome mode if requested
  if (u_forceMonochrome) {
    isGrayscale = 1.0;
  }
  
  vec3 bgColor, symbolColor;
  
  if (isGrayscale > 0.5 || u_forceMonochrome) {
    // MONOCHROMATIC MODE - use single hue with varying sat/brightness
    float baseHue = hsbColor.x;
    
    if (u_forceMonochrome) {
      // For monotone palettes: create monochromatic scheme
      bgColor = hsb2rgb(vec3(baseHue, hsbColor.y * 0.3, hsbColor.z * 1.2));
      symbolColor = hsb2rgb(vec3(baseHue, hsbColor.y * 0.9, hsbColor.z * 0.7));
    } else {
      // For form/grayscale elements: true grayscale
      bgColor = vec3(hsbColor.z * 1.15);
      symbolColor = vec3(hsbColor.z * 0.6);
    }
  } else {
    // COMPLEMENTARY COLOR MODE (for vibrant mask fills)
    // Create background color - slightly adjusted version of original
    bgColor = hsb2rgb(vec3(hsbColor.x, hsbColor.y * 0.8, hsbColor.z * 1.2));
    
    // Create symbol color - complementary hue
    float symbolHue = mod(hsbColor.x + 0.5, 1.0);
    
    // Vary symbol color based on cell position for more variety
    float cellHash = hash21(cellID);
    float hueVariation = (cellHash - 0.5) * 0.2;
    symbolHue = mod(symbolHue + hueVariation, 1.0);
    
    // Choose saturation and brightness for symbol
    float symbolSat = mix(0.7, 1.0, cellHash);
    float symbolBri = cellBri > 0.5 ? 0.3 : 0.9;
    
    symbolColor = hsb2rgb(vec3(symbolHue, symbolSat, symbolBri));
  }
  
  // Mix background and symbol colors
  vec3 finalColor = mix(bgColor, symbolColor, mask);
  
  gl_FragColor = vec4(finalColor, cellColor.a);
}
`

/* ========================= SAVED SEEDS SYSTEM ========================= */

let savedSeeds = []

function loadSavedSeeds() {
  try {
    const stored = localStorage.getItem('AURA_savedSeeds')
    if (stored) {
      savedSeeds = JSON.parse(stored)
    }
  } catch (e) {
    console.warn('Could not load saved seeds:', e)
  }
}

function persistSavedSeeds() {
  try {
    localStorage.setItem('AURA_savedSeeds', JSON.stringify(savedSeeds))
  } catch (e) {
    console.warn('Could not save seeds:', e)
  }
}

function saveSeed(seed) {
  if (!savedSeeds.includes(seed)) {
    savedSeeds.push(seed)
    persistSavedSeeds()
    console.log(`%c★ SEED SAVED: ${seed} (${savedSeeds.length} total saved)`, 'color: #39FF14; font-weight: bold; font-size: 14px;')
  } else {
    console.log(`%c⚠ Seed ${seed} already saved`, 'color: #FFD700;')
  }
}

function removeSeed(seed) {
  const index = savedSeeds.indexOf(seed)
  if (index > -1) {
    savedSeeds.splice(index, 1)
    persistSavedSeeds()
    console.log(`%c✗ SEED REMOVED: ${seed}`, 'color: #FF4500;')
  }
}

function listSavedSeeds() {
  console.log('%c═══════════════════════════════════════', 'color: #00FFFF;')
  console.log('%c       SAVED SEEDS (' + savedSeeds.length + ' total)', 'color: #00FFFF; font-weight: bold; font-size: 14px;')
  console.log('%c═══════════════════════════════════════', 'color: #00FFFF;')
  
  if (savedSeeds.length === 0) {
    console.log('%c  No seeds saved yet. Press F to save current seed.', 'color: #888;')
  } else {
    savedSeeds.forEach((seed, i) => {
      const isCurrent = seed === CURRENT_SEED ? ' ◄ CURRENT' : ''

  console.log('%c  Press F to save current | X to remove current', 'color: #888; font-size: 11px;')

}

function loadSeedByIndex(index) {

function resetAndRegenerate() {
  fillAnimations = []
  nextSpawnFrame = 0

  if (animationPool) {
    animationPool.clear()
  }
  
  // Clear the persistent fill layer on regenerate
  if (fillPersistentLayer) {
    fillPersistentLayer.clear()
  }
  
  applySeed()
  TRAITS = buildTraits()
  PARAMS = resolveParams(TRAITS)
  
  logTraits()
  
  initOrigins()
}

// Swap-and-pop removal - O(1) instead of O(n) splice
function swapRemove(arr, index) {
  arr[index] = arr[arr.length - 1]
  arr.pop()
}

function getBackgroundColor() {
  // Simple dark background based on palette
  if (TRAITS.paletteName === "Doomed") {
    return color(0, 0, 5)
  } else if (TRAITS.paletteName === "Wraith") {
    return color(0, 0, 95)
  } else {
    return color(0, 0, 8)
  }
}

function draw() {
  // Update origins (for Drift/Orbit)
  updateOrigins()
  
  // Update and remove dead animations
  for (let i = fillAnimations.length - 1; i >= 0; i--) {
    fillAnimations[i].update()
    if (fillAnimations[i].isDone()) {
      animationPool.release(fillAnimations[i])
      swapRemove(fillAnimations, i)
    }
  }

  // Cull excess animations
  if (fillAnimations.length > PARAMS.maxAnimations) {
    let minIdx = -1, minVal = Infinity
    for (let i = 0; i < fillAnimations.length; i++) {
      if (fillAnimations[i] instanceof Sparkles || fillAnimations[i] instanceof GradientFill) continue
      const a = fillAnimations[i].averageOpacity()
      if (a < minVal) {
        minVal = a
        minIdx = i
      }
    }
    if (minIdx >= 0) {
      fillAnimations[minIdx].accelerateFade = true
    }
  }

  // Gently fade the persistent layer
  fillPersistentLayer.push()
  fillPersistentLayer.blendMode(BLEND)
  fillPersistentLayer.noStroke()
  fillPersistentLayer.fill(0, 0, 0, (1 - fillPersistentDecay) * 100)
  fillPersistentLayer.rect(0, 0, width, height)
  fillPersistentLayer.pop()

  // Draw current frame's animations
  fillBuffer.clear()
  fillBuffer.background(0, 0, 0, 0)
  for (let s of fillAnimations) {
    s.display(fillBuffer)
  }
  
  // Composite onto persistent layer
  fillPersistentLayer.image(fillBuffer, 0, 0)

  // Spawn new animations
  spawner()

  // === COMPOSITE TO FINAL BUFFER ===
  finalComposite.clear()
  finalComposite.background(getBackgroundColor())
  finalComposite.image(fillPersistentLayer, 0, 0)

  // === APPLY SHADER ===
  finalShadedBuffer.push()
  finalShadedBuffer.rectMode(CORNER)
  finalShadedBuffer.shader(asciiShader)
  asciiShader.setUniform('u_texture', finalComposite)
  asciiShader.setUniform('u_resolution', [width, height])
  asciiShader.setUniform('u_time', millis() / 1000.0)
  asciiShader.setUniform('u_gridX', PARAMS.gridDensity)
  asciiShader.setUniform('u_symbolSize', PARAMS.symbolSize)
  asciiShader.setUniform('u_forceMonochrome', TRAITS.forceMonochrome)
  asciiShader.setUniform('u_applyNoise', true)
  asciiShader.setUniform('u_symbolOffset', PARAMS.symbolOffset)
  finalShadedBuffer.rect(-width/2, -height/2, width, height)
  finalShadedBuffer.pop()
  
  image(finalShadedBuffer, 0, 0)

  captureGifFrame()
}

function keyPressed() {
  if (key === 's' || key === 'S') {
    saveCanvas('AURA_' + CURRENT_SEED, 'png')
    return false
  }
  
  // Regenerate with new random seed
  if (key === 'r' || key === 'R') {
    CURRENT_SEED = randomU32()
    resetAndRegenerate()
    return false
  }

  if (key === 'g' || key === 'G') {
    if (!isRecordingGif) {
      startGifRecording()
    }
    return false
  }
  
  // Favorite/Save current seed
  if (key === 'f' || key === 'F') {
    saveSeed(CURRENT_SEED)
    return false
  }
  
  // List saved seeds
  if (key === 'l' || key === 'L') {
    listSavedSeeds()
    return false
  }
  
  // Remove current seed from saved
  if (key === 'x' || key === 'X') {
    removeSeed(CURRENT_SEED)
    return false
  }
  
  // Show traits again
  if (key === 't' || key === 'T') {
    logTraits()
    return false
  }
  
  // Load saved seeds by number (1-9)
  if (key >= '1' && key <= '9') {
    loadSeedByIndex(parseInt(key) - 1)
    return false
  }
}

let isRecordingGif = false
let gifRecorder = null
let gifFrameCount = 0
const GIF_DURATION = 3
const GIF_SIZE = 450
const GIF_FPS = 24

function startGifRecording() {
  isRecordingGif = true
  gifFrameCount = 0
  

  gifRecorder = new GIF({
    workers: 2,
    quality: 10,
    width: GIF_SIZE,
    height: GIF_SIZE,
    workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
  })
  
  gifRecorder.on('finished', function(blob) {
    // Download the gif
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = 'SATARI_' + CURRENT_SEED + '.gif'
    a.click()
    URL.revokeObjectURL(url)
    isRecordingGif = false
  })
  
  console.log('Recording GIF...')
}

// Reusable canvas for GIF frame capture
let gifCaptureCanvas = null
let gifCaptureCtx = null

function captureGifFrame() {
  if (!isRecordingGif || !gifRecorder) return
  
  // Create canvas once on first use
  if (!gifCaptureCanvas) {
    gifCaptureCanvas = document.createElement('canvas')
    gifCaptureCanvas.width = GIF_SIZE
    gifCaptureCanvas.height = GIF_SIZE
    gifCaptureCtx = gifCaptureCanvas.getContext('2d')
  }
  
  gifCaptureCtx.drawImage(document.querySelector('canvas'), 0, 0, GIF_SIZE, GIF_SIZE)
  
  gifRecorder.addFrame(gifCaptureCtx, {copy: true, delay: 1000 / GIF_FPS})
  gifFrameCount++
  
  const totalFrames = GIF_DURATION * GIF_FPS
  if (gifFrameCount >= totalFrames) {
    console.log('Rendering GIF...')
    gifRecorder.render()
  }
}
let gifWorkerBlobUrl = null;

async function ensureGifWorker() {
  if (gifWorkerBlobUrl) return gifWorkerBlobUrl;
  
  try {
    const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
    const blob = await response.blob();
    gifWorkerBlobUrl = URL.createObjectURL(blob);
    console.log('GIF worker blob URL created successfully');
    return gifWorkerBlobUrl;
  } catch (err) {
    console.warn('Failed to fetch gif worker, using direct URL:', err);
    return 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
  }
}

ensureGifWorker();

window.addEventListener('message', function(event) {
  const { action, requestId, options } = event.data || {};
  
  if (action === 'captureGif') {
    captureRequestId = requestId;
    startGifRecordingForMessage(requestId, options || {});
  } else if (action === 'captureSnapshot') {
    captureSnapshotForMessage(requestId, options || {});
  } else if (action === 'getTraits') {
    sendTraitsToParent(requestId);
  } else if (action === 'download') {
    saveCanvas('SATARI_' + CURRENT_SEED, 'png');
  }
});

async function startGifRecordingForMessage(requestId, options) {
  const duration = options.duration || 2;
  const size = options.size || 400;
  const fps = options.fps || 20;
  const totalFrames = Math.round(duration * fps);
  const frameDelay = Math.round(1000 / fps);
  
  try {
    const mainCanvas = document.querySelector('canvas');
    if (!mainCanvas) {
      throw new Error('Canvas not found - sketch may not be ready');
    }
    
    if (typeof GIF === 'undefined') {
      throw new Error('GIF library not loaded');
    }
    
    const workerUrl = await ensureGifWorker();
    
    isRecordingGif = true;
    gifFrameCount = 0;
    
    console.log('Starting GIF capture:', {duration, size, fps, totalFrames, frameDelay});
    
    const gifEncoder = new GIF({
      workers: 2,
      quality: 10,
      width: size,
      height: size,
      workerScript: workerUrl
    });
    
    gifEncoder.on('finished', function(blob) {
      console.log('GIF finished, size:', blob.size, 'bytes');
      const reader = new FileReader();
      reader.onloadend = function() {
        window.parent.postMessage({
          action: 'gifCaptured',
          requestId: requestId,
          dataUrl: reader.result,
          success: true
        }, '*');
        isRecordingGif = false;
        captureRequestId = null;
      };
      reader.onerror = function() {
        window.parent.postMessage({
          action: 'gifCaptured',
          requestId: requestId,
          success: false,
          error: 'Failed to convert GIF blob to data URL'
        }, '*');
        isRecordingGif = false;
      };
      reader.readAsDataURL(blob);
    });
    
    gifEncoder.on('error', function(err) {
      console.error('GIF encoder error:', err);
      window.parent.postMessage({
        action: 'gifCaptured',
        requestId: requestId,
        success: false,
        error: err.message || 'GIF encoding failed'
      }, '*');
      isRecordingGif = false;
      captureRequestId = null;
    });
    
    // Create canvas once for frame capture (reuse across all frames)
    const scaledCanvas = document.createElement('canvas');
    scaledCanvas.width = size;
    scaledCanvas.height = size;
    const ctx = scaledCanvas.getContext('2d');
    
    let framesCaptured = 0;
    const frameInterval = setInterval(function() {
      if (framesCaptured >= totalFrames) {
        clearInterval(frameInterval);
        console.log('All frames captured, rendering GIF...');
        gifEncoder.render();
        return;
      }
      
      try {
        const currentCanvas = document.querySelector('canvas');
        if (currentCanvas) {
          ctx.drawImage(currentCanvas, 0, 0, size, size);
          gifEncoder.addFrame(ctx, {copy: true, delay: frameDelay});
          framesCaptured++;
        }
      } catch (frameErr) {
        console.warn('Frame capture error:', frameErr);
      }
    }, frameDelay);
    
  } catch (err) {
    console.error('GIF capture initialization error:', err);
    window.parent.postMessage({
      action: 'gifCaptured',
      requestId: requestId,
      success: false,
      error: err.message || 'GIF capture failed to start'
    }, '*');
    isRecordingGif = false;
    captureRequestId = null;
  }
}

function captureSnapshotForMessage(requestId, options) {
  const size = options.size || 600;
  
  try {
    const scaledCanvas = document.createElement('canvas');
    scaledCanvas.width = size;
    scaledCanvas.height = size;
    const ctx = scaledCanvas.getContext('2d');
    const mainCanvas = document.querySelector('canvas');
    
    if (mainCanvas) {
      ctx.drawImage(mainCanvas, 0, 0, size, size);
      const dataUrl = scaledCanvas.toDataURL('image/png');
      
      window.parent.postMessage({
        action: 'snapshotCaptured',
        requestId: requestId,
        dataUrl: dataUrl,
        success: true
      }, '*');
    } else {
      throw new Error('Canvas not found');
    }
  } catch (err) {
    window.parent.postMessage({
      action: 'snapshotCaptured',
      requestId: requestId,
      success: false,
      error: err.message || 'Snapshot capture failed'
    }, '*');
  }
}

function sendTraitsToParent(requestId) {
  try {
    const traits = {
      seed: CURRENT_SEED,
      archetype: TRAITS?.archetype || null,
      displayedArchetype: TRAITS?.displayedArchetype || null,
      paletteName: TRAITS?.paletteName || null,
      sight: TRAITS?.sight || null,
      voice: TRAITS?.voice || null,
      scent: TRAITS?.scent || null,
      ornament: TRAITS?.ornament || null,
      hollows: TRAITS?.hollows || null,
      ground: TRAITS?.ground || null,
      aura: TRAITS?.aura || null,
      fillVariant: TRAITS?.fillVariant || null,
      iris: TRAITS?.iris || null,
    };
    
    window.parent.postMessage({
      action: 'traitsSent',
      requestId: requestId,
      success: true,
      traits: JSON.stringify(traits)
    }, '*');
  } catch (err) {
    window.parent.postMessage({
      action: 'traitsSent',
      requestId: requestId,
      success: false,
      error: err.message || 'Failed to get traits'
    }, '*');
  }
}


let sketchReadySent = false;

function sendSketchReady() {
  if (sketchReadySent) return;
  const canvas = document.querySelector('canvas');
  if (canvas && typeof draw === 'function') {
    sketchReadySent = true;
    console.log('Sending sketchReady to parent');
    window.parent.postMessage({ action: 'sketchReady' }, '*');
  }
}

// Single unified ready-check mechanism
let readyCheckCount = 0;
const readyCheckInterval = setInterval(function() {
  sendSketchReady();
  readyCheckCount++;
  if (sketchReadySent || readyCheckCount > 20) {
    clearInterval(readyCheckInterval);
  }
}, 250);
