let CURRENT_SEED = null

// --- BREATH SETTINGS ---
let FORM_BREATH_HZ = 0.4   
let FORM_BREATH_AMP = 10    
let BREATH_DELAY_PART1 = 0.30  
let BREATH_DELAY_MASK = 0.20  

// --- ANIMATION SPEED SETTINGS ---
let FILL_ANIMATION_SPEED_MULT = 2.2

let _breathStartMillis = null

function seedFromString(str) {
  let h = 2166136261 >>> 0
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  h += h << 13
  h ^= h >>> 7
  h += h << 3
  h ^= h >>> 17
  h += h << 5
  return h >>> 0
}

function randomU32() {
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1)
    crypto.getRandomValues(a)
    return a[0] >>> 0
  }
  return (Math.random() * 0xffffffff) >>> 0
}

function readSeedFromURL() {
  const params = new URLSearchParams(window.location.search)
  if (params.has("seed")) {
    CURRENT_SEED = Number(params.get("seed")) >>> 0
  } else {
    CURRENT_SEED = randomU32()
  }
}

function applySeed() {
  randomSeed(CURRENT_SEED)
  noiseSeed(CURRENT_SEED)
}

/* ========================= TRAIT RNG / PICKERS ========================= */

function mulberry32(a) {
  return () => {
    let t = (a += 0x6d2b79f5)
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

function makeTraitRNG(tag) {
  return mulberry32(seedFromString(tag + "_" + CURRENT_SEED))
}

function pickWeightedWith(rng, table) {
  let sum = 0
  for (const [, w] of table) sum += w
  let r = rng() * sum, acc = 0
  for (const [v, w] of table) {
    acc += w
    if (r <= acc) return v
  }
  return table.at(-1)[0]
}

/* ========================= MASK TRAITS ========================= */

function buildTraits() {
  const rPal = makeTraitRNG("palette")
  const rEssence = makeTraitRNG("essence")
  const rHarmony = makeTraitRNG("harmony")
  const rOrigin = makeTraitRNG("origin")
  const rBreath = makeTraitRNG("breath")
  const rDensity = makeTraitRNG("density")
  const rTexture = makeTraitRNG("texture")
  const rBlend = makeTraitRNG("blendSchema")
  const rWavyDir = makeTraitRNG("wavyDirection")
  const rExpandRotation = makeTraitRNG("expandingRotation")
  const rExpandPersist = makeTraitRNG("expandingPersist")

  let paletteName = pickWeightedWith(rPal, [
    // Vibrant
    ["Flux", 10],
    ["Acid", 10],
    ["Surge", 10],
    ["Infra", 10],
    ["Toxin", 10],
    ["Auric", 10],
    ["Jazz", 10],
    ["Corrupt", 10],
    ["Vapor", 10],
    ["Tropic", 10],
    ["Wraith", 10],
    ["Doomed", 10],
    ["Ground Beef", 10],
    ["Riptide", 10],
    
    // Monotone
    ["Petal", 10],
    ["Sage", 10],
    ["Lilac", 10],
    ["Crimson", 10],
    ["Abyss", 10],
    ["Canopy", 10],
    ["Amber", 10],
    ["Haze", 10],
    ["Current", 10],
    
    // Analogous
    ["Flare", 10],
    ["Coast", 10],
    ["Flora", 10],
    ["Astra", 10],
    ["Dune", 10],
    ["Polar", 10],
    
    // Complementary
    ["Clash", 10],
    ["Royal", 10],
    ["Axis", 10],
    ["Blood", 10],
    ["Signal", 10],
    ["Dual", 10],
  ])

  const monochromeList = [
    "Petal", "Sage", "Lilac", 
    "Crimson", "Abyss", "Canopy", 
    "Amber", "Haze", "Current",
    "Ground Beef", "Riptide"
  ]

  // ESSENCE - Primary animation type
  let essence = pickWeightedWith(rEssence, [
    ["Nova", 10],           // Supernova - expanding rectangles
    ["Pulse", 10],          // ExpandingCircles
    ["Bloom", 10],          // ExpandingSquares
    ["Rain", 10],           // VerticalStripes
    ["Horizon", 10],        // HorizontalStripes
    ["Gradient", 10],       // Gradient fill
    ["Flow", 100],           // WavyLines
    ["Scatter", 10],        // Sparkles
    ["Cells", 10],          // VoronoiCells
  ])
  
  // HARMONY - Secondary layer behavior
  let harmony = pickWeightedWith(rHarmony, [
    ["None", 40],           // Single essence only
    ["Echo", 25],           // Same essence, offset
    ["Contrast", 20],       // Different essence layered
    ["Whisper", 15],        // Subtle secondary
  ])
  
  // ORIGIN - Where energy spawns
  let origin = pickWeightedWith(rOrigin, [
    ["Core", 30],           // Center point
    ["Twin", 20],           // Two mirrored points
    ["Scatter", 20],        // Random positions
    ["Drift", 15],          // Wandering origin
    ["Edge", 10],           // From borders
    ["Orbit", 5],           // Circling origins
  ])
  
  // BREATH - Animation rhythm
  let breath = pickWeightedWith(rBreath, [
    ["Steady", 35],         // Consistent pace
    ["Slow", 25],           // Meditative
    ["Quick", 20],          // Energetic
    ["Erratic", 15],        // Unpredictable
    ["Held", 5],            // Pauses and bursts
  ])
  
  // DENSITY - Activity level
  let density = pickWeightedWith(rDensity, [
    ["Balanced", 40],       // Medium
    ["Sparse", 25],         // Minimal, negative space
    ["Dense", 25],          // Busy, overlapping
    ["Overwhelming", 10],   // Maximum
  ])
  
  // TEXTURE - Shader treatment
  let texture = pickWeightedWith(rTexture, [
    ["Glyph", 40],          // Full ASCII shader
    ["Raw", 30],            // No shader, smooth
    ["Grain", 20],          // Subtle noise
    ["Interference", 10],   // Scanlines/patterns
  ])

  // Map essence to fill variant
  const essenceToFill = {
    "Nova": "Supernova",
    "Pulse": "ExpandingCircles",
    "Bloom": "ExpandingSquares",
    "Rain": "VerticalStripes",
    "Horizon": "HorizontalStripes",
    "Gradient": "Gradient",
    "Flow": "WavyLines",
    "Scatter": "Sparkles",
    "Cells": "VoronoiCells"
  }
  
  // Map breath to spawn timing
  const breathToSpawn = {
    "Steady": 12,
    "Slow": 24,
    "Quick": 6,
    "Erratic": 10,
    "Held": 30
  }
  
  // Map density to max animations
  const densityToMax = {
    "Sparse": 8,
    "Balanced": 15,
    "Dense": 25,
    "Overwhelming": 40
  }

  return {
    paletteName,
    essence,
    harmony,
    origin,
    breath,
    density,
    texture,
    
    // Mapped values for the engine
    fillVariant: essenceToFill[essence],
    baseSpawnEvery: breathToSpawn[breath],
    maxAnimations: densityToMax[density],
    
    blendSchema: pickWeightedWith(rBlend, [
      ["NoBlend", 30],
      ["MostlyDIFF", 30], 
      ["AltDiffAdd", 15], 
      ["PowerTrio", 15],
      ["Nocturne", 5], 
      ["InvertedNight", 5]
    ]),

    sizeEnvelope: "Titanic",  // Always big for full canvas
    gridDensity: 90,
    symbolSize: 1.20,

    wavyDirection: pickWeightedWith(rWavyDir, [
      ["horizontal-right", 15],    // Left to right
      ["horizontal-left", 15],     // Right to left
      ["horizontal-clash", 10],    // Both directions clashing
      ["vertical-down", 15],       // Top to bottom
      ["vertical-up", 15],         // Bottom to top
      ["diagonal", 10],            // Diagonal lines only
      ["chaos", 20],               // Everything mixed
    ]),
    expandingRotation: pickWeightedWith(rExpandRotation, [
      ["rotating", 30],
      ["static", 70],
    ]),
    expandingPersist: pickWeightedWith(rExpandPersist, [
      ["fade", 30],
      ["persist", 70],
    ]),
    forceMonochrome: monochromeList.includes(paletteName),
    applyNoise: true,
  }
}

/* ========================= AURA ORIGIN SYSTEM ========================= */

let originPoints = []

function initOrigins() {
  originPoints = []
  const origin = TRAITS.origin
  const cx = width / 2
  const cy = height / 2
  
  if (origin === "Core") {
    originPoints.push({ x: cx, y: cy, vx: 0, vy: 0 })
  } 
  else if (origin === "Twin") {
    originPoints.push({ x: cx - 150, y: cy, vx: 0, vy: 0 })
    originPoints.push({ x: cx + 150, y: cy, vx: 0, vy: 0 })
  }
  else if (origin === "Scatter") {
    const count = floor(random(3, 6))
    for (let i = 0; i < count; i++) {
      originPoints.push({ 
        x: random(width * 0.2, width * 0.8), 
        y: random(height * 0.2, height * 0.8),
        vx: 0, vy: 0
      })
    }
  }
  else if (origin === "Drift") {
    originPoints.push({ 
      x: cx, y: cy, 
      vx: random(-0.5, 0.5), 
      vy: random(-0.5, 0.5) 
    })
  }
  else if (origin === "Edge") {
    // Spawn from edges
    originPoints.push({ x: 0, y: cy, vx: 0, vy: 0 })
    originPoints.push({ x: width, y: cy, vx: 0, vy: 0 })
    originPoints.push({ x: cx, y: 0, vx: 0, vy: 0 })
    originPoints.push({ x: cx, y: height, vx: 0, vy: 0 })
  }
  else if (origin === "Orbit") {
    const count = 3
    for (let i = 0; i < count; i++) {
      const angle = (TWO_PI / count) * i
      originPoints.push({
        x: cx + cos(angle) * 200,
        y: cy + sin(angle) * 200,
        angle: angle,
        orbitSpeed: random(0.005, 0.015),
        orbitRadius: 200
      })
    }
  }
}

function updateOrigins() {
  for (let o of originPoints) {
    // Drift movement
    if (o.vx !== 0 || o.vy !== 0) {
      o.x += o.vx
      o.y += o.vy
      
      // Bounce off edges
      if (o.x < 50 || o.x > width - 50) o.vx *= -1
      if (o.y < 50 || o.y > height - 50) o.vy *= -1
    }
    
    // Orbit movement
    if (o.orbitSpeed) {
      o.angle += o.orbitSpeed
      o.x = width/2 + cos(o.angle) * o.orbitRadius
      o.y = height/2 + sin(o.angle) * o.orbitRadius
    }
  }
}

function getSpawnPoint() {
  if (originPoints.length === 0) return { x: width/2, y: height/2 }
  const o = random(originPoints)
  return { 
    x: o.x + randomGaussian(0, 30), 
    y: o.y + randomGaussian(0, 30) 
  }
}

/* ========================= FILL ANIMATION CLASSES ========================= */

class FillAnimation {
  constructor(x, y, palette, traits) {
    this.x = x
    this.y = y
    this.palette = palette
    this.traits = traits
    this.opacity = 100
    this.age = 0
    this.accelerateFade = false
  }

  update() {
    this.age++
    // Fade faster if marked for accelerated removal (but still gradual)
    const fadeRate = this.accelerateFade ? 0.15 : 0.0375
    this.opacity = max(0, this.opacity - fadeRate)
  }

  reset(x, y, palette, traits) {
    this.x = x
    this.y = y
    this.palette = palette
    this.traits = traits
    this.opacity = 100
    this.age = 0
    this.accelerateFade = false
  }

  display(g) {}


  getBlend(defaultMode) {
    return this.traits.blendSchema === "NoBlend" ? BLEND : defaultMode
  }

  isDone() {
    return this.opacity <= 0
  }

  isOffscreen() {
    return false
  }

  averageOpacity() {
    return this.opacity
  }
}

class Supernova extends FillAnimation {
  constructor(x, y, palette, count, sizeRange, traits) {
    super(x, y, palette, traits)
    this.count = count
    this.sizeRange = sizeRange
    this.rectangles = []
    
    // Incremental tracking for O(1) isDone/isOffscreen checks
    this.startedCount = 0
    this.fadedCount = 0

    this.shouldRotate = random() > 0.8

    const layers = Math.ceil(count / 8)
    const rectsPerLayer = Math.ceil(count / layers)
    
    let rectIndex = 0
    for (let layer = 0; layer < layers && rectIndex < count; layer++) {
      const numInLayer = Math.min(rectsPerLayer, count - rectIndex)
      
      for (let i = 0; i < numInLayer; i++) {
        const angle = (TWO_PI / numInLayer) * i + random(-0.2, 0.2) 
        
      const speed = (this.shouldRotate ? random(0.005, 0.015) : random(0.015, 0.025)) * FILL_ANIMATION_SPEED_MULT
        
        const startDist = random(10, 40)
        const sx = this.x + cos(angle) * startDist
        const sy = this.y + sin(angle) * startDist
        
        const layerSizeMod = layers > 1 ? map(layer, 0, layers - 1, 1.2, 0.8) : 1.0
        const w = random(sizeRange[0], sizeRange[1]) * layerSizeMod
        const h = random(sizeRange[0], sizeRange[1]) * layerSizeMod
        
        const col = random(palette)
        
        const fadeRate = random(0.015, 0.025)
        const blendMode = this.pickBlend(rectIndex)

        this.rectangles.push({
          x: sx,
          y: sy,
          vx: cos(angle) * speed,
          vy: sin(angle) * speed,
          width: 0,
          height: 0,
          baseWidth: w,
          baseHeight: h,
          color: col,
          opacity: 100,
          fadeRate,
          blendMode,
          rotation: this.shouldRotate ? angle + HALF_PI : 0, 
          rotSpeed: this.shouldRotate ? random(-0.005, 0.005) : 0, 
          growthPhase: random(TWO_PI),
          layer: layer,
          angle: angle,
          delay: rectIndex * 6,  
          started: false,
          faded: false
        })
        rectIndex++
      }
    }
  }

  pickBlend(i) {
    const s = this.traits.blendSchema
    if (s === "NoBlend") return BLEND
    if (s === "MostlyDIFF") return DIFFERENCE
    if (s === "AltDiffAdd") return i % 2 === 0 ? DIFFERENCE : ADD
    if (s === "PowerTrio") return [DIFFERENCE, ADD, MULTIPLY][i % 3]
    if (s === "Nocturne") return SCREEN
    if (s === "InvertedNight") return EXCLUSION
    return BLEND
  }

  reset(x, y, palette, count, sizeRange, traits) {
    super.reset(x, y, palette, traits)
    this.count = count
    this.sizeRange = sizeRange
    this.rectangles = []
    
    // Reset tracking
    this.startedCount = 0
    this.fadedCount = 0

    this.shouldRotate = random() > 0.8  // 20% chance, matching constructor

    const layers = Math.ceil(count / 8)
    const rectsPerLayer = Math.ceil(count / layers)
    
    let rectIndex = 0
    for (let layer = 0; layer < layers && rectIndex < count; layer++) {
      const numInLayer = Math.min(rectsPerLayer, count - rectIndex)
      
      for (let i = 0; i < numInLayer; i++) {
        const angle = (TWO_PI / numInLayer) * i + random(-0.2, 0.2) 
        
        const speed = (this.shouldRotate ? random(0.015, 0.045) : random(0.025, 0.075)) * FILL_ANIMATION_SPEED_MULT
        
        const startDist = random(1, 4)
        const sx = this.x + cos(angle) * startDist
        const sy = this.y + sin(angle) * startDist
        
        const layerSizeMod = layers > 1 ? map(layer, 0, layers - 1, 1.2, 0.8) : 1.0
        const w = random(sizeRange[0], sizeRange[1]) * layerSizeMod
        const h = random(sizeRange[0], sizeRange[1]) * layerSizeMod
        
        const col = random(palette)
        
        const fadeRate = random(0.015, 0.025)
        const blendMode = this.pickBlend(rectIndex)

        this.rectangles.push({
          x: sx,
          y: sy,
          vx: cos(angle) * speed,
          vy: sin(angle) * speed,
          width: 0,
          height: 0,
          baseWidth: w,
          baseHeight: h,
          color: col,
          opacity: 100,
          fadeRate,
          blendMode,
          rotation: this.shouldRotate ? angle + HALF_PI : 0, 
          rotSpeed: this.shouldRotate ? random(-0.005, 0.005) : 0, 
          growthPhase: random(TWO_PI),
          layer: layer,
          angle: angle,
          delay: rectIndex * 6,
          started: false,
          faded: false
        })
        rectIndex++
      }
    }
  }

  update() {
    super.update()
    
    for (let r of this.rectangles) {

      if (this.age < r.delay) continue
      
      if (!r.started) {
        r.started = true
        r.startAge = this.age
        this.startedCount++
      }
      
      let newX = r.x + r.vx
      let newY = r.y + r.vy
      
      const constrained = constrainToMaskBounds(newX, newY, r.vx, r.vy)
      r.x = constrained.x
      r.y = constrained.y
      r.vx = constrained.vx
      r.vy = constrained.vy
      
      r.rotation += r.rotSpeed
      // Fade faster if marked for accelerated removal
      const fadeMultiplier = this.accelerateFade ? 8 : 1
      r.opacity = max(0, r.opacity - r.fadeRate * fadeMultiplier)
      
      // Track when rectangle fully fades
      if (!r.faded && r.opacity <= 0) {
        r.faded = true
        this.fadedCount++
      }
      
      this.applyGrowthProfile(r)
    }
  }

  applyGrowthProfile(r) {
    const profile = this.traits.growthProfile
    const rectAge = r.started ? (this.age - r.startAge) : 0
    
    const expansionDuration = 90
    let baseScale = 1.0
    if (rectAge < expansionDuration) {
      const t = rectAge / expansionDuration

      baseScale = 1 - pow(1 - t, 3)
    }
    
    if (profile === "Bilateral") {
      const scale = baseScale * (1.0 + sin(rectAge * 0.05 + r.growthPhase) * 0.15)
      r.width = r.baseWidth * scale
      r.height = r.baseHeight * scale
      
    } else if (profile === "Aniso-X") {
      const scaleX = baseScale * (1.0 + sin(rectAge * 0.05 + r.growthPhase) * 0.3)
      const scaleY = baseScale * (1.0 + sin(rectAge * 0.05 + r.growthPhase) * 0.05)
      r.width = r.baseWidth * scaleX
      r.height = r.baseHeight * scaleY
      
    } else if (profile === "Aniso-Y") {
      const scaleX = baseScale * (1.0 + sin(rectAge * 0.05 + r.growthPhase) * 0.05)
      const scaleY = baseScale * (1.0 + sin(rectAge * 0.05 + r.growthPhase) * 0.3)
      r.width = r.baseWidth * scaleX
      r.height = r.baseHeight * scaleY
      
    } else if (profile === "Eased-Then-Coast") {
      const easeDuration = 120
      if (rectAge < easeDuration) {
        const t = rectAge / easeDuration
        const easeOut = 1 - pow(1 - t, 3)
        const scale = baseScale * (1.0 + easeOut * 0.4)
        r.width = r.baseWidth * scale
        r.height = r.baseHeight * scale
      } else {
        r.width = r.baseWidth * 1.4
        r.height = r.baseHeight * 1.4
      }
      
    } else if (profile === "Breathing") {
      const breathFreq = 0.05
      const breathDepth = 0.5
      const breathPhase = sin(rectAge * breathFreq + r.growthPhase)
      const scale = baseScale * (1.0 + breathPhase * breathDepth)
      r.width = r.baseWidth * scale
      r.height = r.baseHeight * scale
    } else {

      r.width = r.baseWidth * baseScale
      r.height = r.baseHeight * baseScale
    }
  }

  display(g) {
    for (let r of this.rectangles) {
      if (!r.started || r.opacity <= 0) continue
      
      g.push()
      g.blendMode(r.blendMode)
      g.translate(r.x, r.y)
      g.rotate(r.rotation)
      
      // Apply rectangle's individual opacity
      const c = g.color(r.color)
      c.setAlpha(r.opacity)
      g.fill(c)
      g.noStroke()
      g.rectMode(CENTER)
      g.rect(0, 0, r.width, r.height)
      g.pop()
    }
  }

  isOffscreen() {
    // Only check if all have started and faded - then check positions
    if (this.fadedCount < this.rectangles.length) return false
    
    for (let r of this.rectangles) {
      const inBounds = !(
        r.x + r.width / 2 < -width ||
        r.x - r.width / 2 > 2 * width ||
        r.y + r.height / 2 < -height ||
        r.y - r.height / 2 > 2 * height
      )
      if (inBounds) return false
    }
    return true
  }

  isDone() {
    // O(1) check using incremental counters
    const total = this.rectangles.length
    return this.startedCount >= total && this.fadedCount >= total
  }

  averageOpacity() {
    if (this.startedCount === 0) return 100
    let sum = 0
    for (let r of this.rectangles) {
      if (r.started) sum += r.opacity
    }
    return sum / this.startedCount
  }
}

class ExpandingCircles extends FillAnimation {
  constructor(x, y, palette, traits) {

      })
    }
  }

  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.circles = []
    const count = floor(random(1, 3))
    for (let i = 0; i < count; i++) {
      this.circles.push({
        radius: random(10, 20),
        maxRadius: random(500, 900),
        speed: random(0.375, 3.0) * FILL_ANIMATION_SPEED_MULT,
        strokeWeight: random(2, 6),
        color: random(palette),
        opacity: 100,
        blendMode: this.getBlend(i % 2 === 0 ? DIFFERENCE : ADD)
      })
    }
  }

  update() {
    super.update()
    const speedMultiplier = this.accelerateFade ? 4 : 1
    for (let c of this.circles) {
      c.radius += c.speed * speedMultiplier
      // Smoother fade - start fading earlier but more gradually
      const fadeProgress = c.radius / c.maxRadius
      c.opacity = map(fadeProgress, 0.3, 1.0, 100, 0, true)
    }
  }

  display(g) {
    g.push()
    g.noFill()
    for (let c of this.circles) {
      if (c.opacity <= 0) continue
      
      g.push()
      g.blendMode(c.blendMode)
      
      // Apply circle's opacity
      const col = g.color(c.color)
      col.setAlpha(c.opacity)
      g.stroke(col)
      g.strokeWeight(c.strokeWeight)
      g.noFill()
      g.circle(this.x, this.y, c.radius * 2)
      g.pop()
    }
    g.pop()
  }
  
  isDone() {
    return this.circles.every(c => c.opacity <= 0)
  }
  
  averageOpacity() {
    if (this.circles.length === 0) return 0
    return this.circles.reduce((sum, c) => sum + c.opacity, 0) / this.circles.length
  }
}

class ExpandingSquares extends FillAnimation {
  constructor(x, y, palette, traits) {
    super(x, y, palette, traits)
    this.squares = []
    this.persistMode = (traits.expandingPersist === 'persist')
    this.persistentLayer = null
    this.rotationMode = traits.expandingRotation || 'rotating'
    
    this.fixedRotation = this.rotationMode === 'static' ? random([0, QUARTER_PI, HALF_PI, QUARTER_PI * 3]) : 0
    
    const count = floor(random(1, 7))
    for (let i = 0; i < count; i++) {
      this.squares.push({
        size: random(10, 30),
        maxSize: random(500, 900),
        speed: random(0.375, 3.0) * FILL_ANIMATION_SPEED_MULT,
        strokeWeight: random(2, 6),
        width: random(0.5, 1.5),
        height: random(0.5, 1.5),
        rotation: this.rotationMode === 'rotating' ? random(TWO_PI) : this.fixedRotation,
        rotSpeed: this.rotationMode === 'rotating' ? random(-0.02, 0.02) : 0,
        color: random(palette),
        opacity: 100,
        blendMode: this.getBlend(i % 2 === 0 ? DIFFERENCE : ADD)
      })
    }
  }
  
  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.squares = []
    this.persistMode = (traits.expandingPersist === 'persist')
    this.rotationMode = traits.expandingRotation || 'rotating'
    
    if (!this.fixedRotation && this.rotationMode === 'static') {
      this.fixedRotation = random([0, QUARTER_PI, HALF_PI, QUARTER_PI * 3])
    }
    
    const count = floor(random(1, 3))
    
    if (this.persistMode && !this.persistentLayer) {
      this.persistentLayer = createGraphics(width, height)
      this.persistentLayer.clear()
    } else if (!this.persistMode && this.persistentLayer) {
      this.persistentLayer.remove()
      this.persistentLayer = null
    } else if (this.persistMode && this.persistentLayer) {
      this.persistentLayer.clear()
    }
    
    for (let i = 0; i < count; i++) {
      this.squares.push({
        size: random(10, 20),
        maxSize: random(500, 900),
        speed: random(0.375, 3.0) * FILL_ANIMATION_SPEED_MULT,
        strokeWeight: random(2, 6),
        width: random(0.5, 1.5),
        height: random(0.5, 1.5),
        rotation: this.rotationMode === 'rotating' ? random(TWO_PI) : this.fixedRotation,
        rotSpeed: this.rotationMode === 'rotating' ? random(-0.02, 0.02) : 0,
        color: random(palette),
        opacity: 100,
        blendMode: this.getBlend(i % 2 === 0 ? DIFFERENCE : ADD)
      })
    }
  }
  
  update() {
    super.update()
    const speedMultiplier = this.accelerateFade ? 4 : 1
    for (let s of this.squares) {
      s.size += s.speed * speedMultiplier
      s.rotation += s.rotSpeed
      if (!this.persistMode) {
        // Smoother fade - start fading earlier
        const fadeProgress = s.size / s.maxSize
        s.opacity = map(fadeProgress, 0.3, 1.0, 100, 0, true)
      } else {
        // In persist mode, fade after reaching max size (more gradual)
        if (s.size >= s.maxSize) {
          s.opacity = max(0, s.opacity - (this.accelerateFade ? 4 : 0.5))
        }
      }
    }
  }
  
  display(g) {
    g.push()
    
    if (this.persistMode && this.persistentLayer) {
      g.image(this.persistentLayer, 0, 0)
    }
    
    g.noFill()
    for (let s of this.squares) {
      if (s.opacity <= 0) continue

      const targetBuffer = (this.persistMode && this.persistentLayer) ? this.persistentLayer : g
      
      targetBuffer.push()
      targetBuffer.blendMode(s.blendMode)
      targetBuffer.stroke(s.color)
      targetBuffer.strokeWeight(s.strokeWeight)
      targetBuffer.noFill()
      

      if (!this.persistMode) {
        const c = color(s.color)
        c.setAlpha(s.opacity)
        targetBuffer.stroke(c)
      }
      
      targetBuffer.translate(this.x, this.y)
      targetBuffer.rotate(s.rotation)
      targetBuffer.rectMode(CENTER)
      targetBuffer.rect(0, 0, s.size * s.width * 2, s.size * s.height * 2)
      targetBuffer.pop()
      
      if (this.persistMode && this.persistentLayer && targetBuffer === this.persistentLayer) {
        g.push()
        g.blendMode(s.blendMode)
        g.stroke(s.color)
        g.strokeWeight(s.strokeWeight)
        g.noFill()
        g.translate(this.x, this.y)
        g.rotate(s.rotation)
        g.rectMode(CENTER)
        g.rect(0, 0, s.size * s.width * 2, s.size * s.height * 2)
        g.pop()
      }
    }
    
    g.pop()
  }
  
  isDone() {
    return this.squares.every(s => s.opacity <= 0)
  }
  
  averageOpacity() {
    if (this.squares.length === 0) return 0
    return this.squares.reduce((sum, s) => sum + s.opacity, 0) / this.squares.length
  }
}

class VerticalStripes extends FillAnimation {
  constructor(x, y, palette, traits) {
    super(x, y, palette, traits)

  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.stripes = []
    const count = floor(random(4, 10))
    const spacing = width / count
    for (let i = 0; i < count; i++) {
      this.stripes.push({
        x: i * spacing + random(-spacing * 0.3, spacing * 0.3),
        y: random(-height * 0.2, height * 0.2),

      })

    for (let s of this.stripes) {
      s.height = min(s.height + s.speed * speedMultiplier, s.maxHeight)
      // Fade after reaching max height (gradual)
      if (s.height >= s.maxHeight) {
        s.opacity = max(0, s.opacity - (this.accelerateFade ? 2 : 0.5))
      }
    }
  }

  display(g) {
    g.push()
    g.noStroke()
    for (let s of this.stripes) {
      if (s.opacity <= 0) continue

      g.blendMode(s.blendMode)

      c.setAlpha(s.opacity)

      g.rect(s.x, s.y, s.width, s.height)
      g.pop()
    }
    g.pop()
  }
  
  isDone() {
    return this.stripes.every(s => s.opacity <= 0)
  }
  
  averageOpacity() {
    if (this.stripes.length === 0) return 0
    return this.stripes.reduce((sum, s) => sum + s.opacity, 0) / this.stripes.length
  }
}

class GradientFill extends FillAnimation {
  constructor(x, y, palette, traits) {
    super(x, y, palette, traits)
    this.radius = 0
    this.prevRadius = 0
    this.maxRadius = max(width, height) * 1.5
    this.speed = random(1.5, 3) * FILL_ANIMATION_SPEED_MULT
    this.colors = []
    this.persistentLayer = createGraphics(width, height)
    this.angle = random(TWO_PI)
    this.lifetime = 0
    this.fadeStartTime = null
    
    const colorCount = floor(random(3, 6))
    for (let i = 0; i < colorCount; i++) {
      this.colors.push(random(palette))
    }
  }
  
  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.radius = 0
    this.prevRadius = 0
    this.maxRadius = max(width, height) * 1.5
    this.speed = random(1.5, 3) * FILL_ANIMATION_SPEED_MULT
    this.colors = []
    this.angle = random(TWO_PI)
    this.lifetime = 0
    this.fadeStartTime = null
    
    // Recreate persistentLayer if it was cleaned up
    if (!this.persistentLayer) {
      this.persistentLayer = createGraphics(width, height)
    }
    this.persistentLayer.clear()
    
    const colorCount = floor(random(3, 20))
    for (let i = 0; i < colorCount; i++) {
      this.colors.push(random(palette))
    }
  }
  
  update() {
    this.age++
    this.lifetime++
    this.prevRadius = this.radius
    this.radius = min(this.radius + this.speed, this.maxRadius)
    
    if (this.radius >= this.maxRadius && this.fadeStartTime === null) {
      this.fadeStartTime = this.lifetime
    }
    
    if (this.radius > this.prevRadius && this.radius < this.maxRadius) {
      const pl = this.persistentLayer
      pl.push()
      pl.noStroke()
      pl.blendMode(BLEND)
      
      const r = this.radius
      const t = r / this.maxRadius
      
      const colorIndex = floor(t * (this.colors.length - 1))
      const nextColorIndex = min(colorIndex + 1, this.colors.length - 1)
      const localT = (t * (this.colors.length - 1)) % 1
      const c = lerpColor(color(this.colors[colorIndex]), color(this.colors[nextColorIndex]), localT)
      
      pl.noFill()
      pl.stroke(c)
      pl.strokeWeight(this.speed + 1)
      pl.circle(this.x, this.y, r * 2)
      
      pl.pop()
    }
  }
  
  getVisualOpacity() {
    if (this.fadeStartTime === null) {
      return 255
    }
    const fadeTime = 200
    const timeSinceFade = this.lifetime - this.fadeStartTime
    return max(0, map(timeSinceFade, 0, fadeTime, 255, 0))
  }
  
  display(g) {
  g.push()
  const opacity = this.getVisualOpacity()
  if (opacity < 255) {
    g.tint(255, opacity)
  }
  g.image(this.persistentLayer, 0, 0)
  g.pop()
}
  
  isDone() {
    return this.getVisualOpacity() <= 0
  }
  
  averageOpacity() {
    if (this.fadeStartTime === null) {
      return 200
    }
    return this.getVisualOpacity() + 100
  }
}
 
class WavyLines extends FillAnimation {
  constructor(x, y, palette, traits) {
    super(x, y, palette, traits)
    this.lines = []
    this.persistMode = random() < 0.05  // Reduced - persist layers expensive for moving geometry
    this.persistentLayer = null
    this.directionMode = traits.wavyDirection || 'chaos'
    this.noiseOffset = random(100) // Unique noise offset per instance
    
    const lineCount = floor(random(2, 10))
      
    for (let i = 0; i < lineCount; i++) {
      const orientation = this.pickOrientation()
      this.lines.push(this.createLine(orientation, palette, i))
    }
  }
  
  // Pick orientation based on direction mode
  pickOrientation() {
    const mode = this.directionMode
    
    if (mode === 'horizontal-right') {
      return 'horizontal-right'
    } else if (mode === 'horizontal-left') {
      return 'horizontal-left'
    } else if (mode === 'horizontal-clash') {
      return random() < 0.5 ? 'horizontal-right' : 'horizontal-left'
    } else if (mode === 'vertical-down') {
      return 'vertical-down'
    } else if (mode === 'vertical-up') {
      return 'vertical-up'
    } else if (mode === 'diagonal') {
      // Pick from diagonal variants
      const r = random()
      if (r < 0.25) return 'diagonal-down-right'
      else if (r < 0.5) return 'diagonal-down-left'
      else if (r < 0.75) return 'diagonal-up-right'
      else return 'diagonal-up-left'
    } else {
      // Chaos - everything mixed
      const r = random()
      if (r < 0.15) return 'horizontal-right'
      else if (r < 0.30) return 'horizontal-left'
      else if (r < 0.45) return 'vertical-down'
      else if (r < 0.60) return 'vertical-up'
      else if (r < 0.70) return 'diagonal-down-right'
      else if (r < 0.80) return 'diagonal-down-left'
      else if (r < 0.90) return 'diagonal-up-right'
      else return 'diagonal-up-left'
    }
  }
  
  createLine(orientation, palette, index) {
    const fullSpan = max(width, height) * 1.5 // Extended for diagonal lines
    const crossSpan = orientation === 'horizontal' ? height : width
    
    // Variable start/end - some full, some partial
    const spanType = random()
    let startT, endT
    if (spanType < 0.3) {
      // Full span
      startT = 0
      endT = 1
    } else if (spanType < 0.6) {
      // Partial from edge
      startT = 0
      endT = random(0.3, 0.8)
    } else if (spanType < 0.8) {
      // Partial to edge  
      startT = random(0.2, 0.7)
      endT = 1
    } else {
      // Floating middle segment
      startT = random(0.1, 0.4)
      endT = random(0.6, 0.9)
    }
    
    // Organic wave parameters - multiple harmonics
    const baseFreq = random(1.5, 4)
    const harmonics = [
      { freq: baseFreq, amp: random(20, 10), phase: random(TWO_PI) },
      { freq: baseFreq * random(1.8, 2.5), amp: random(8, 25), phase: random(TWO_PI) },
      { freq: baseFreq * random(0.3, 0.6), amp: random(15, 40), phase: random(TWO_PI) },
    ]
    
    // Noise-based amplitude modulation seeds
    const noiseSeedX = random(100)
    const noiseSeedY = random(1000)
    
    // Per-segment offsets for variable speed along the line
    const numSegments = 40
    const baseOffset = -random(100, 300)
    const baseSpeed = random(0.3, 5.2) * FILL_ANIMATION_SPEED_MULT
    
    // Create segment data with individual speeds
    const segments = []
    for (let i = 0; i <= numSegments; i++) {
      const t = i / numSegments
      // Each segment gets its own speed variation
      const speedVariation = random(0.4, 1.6) // Some segments faster, some slower
      segments.push({
        offset: baseOffset,
        speed: baseSpeed * speedVariation,
        // Noise seeds for dynamic speed changes over time
        speedNoiseSeed: random(1000),
      })
    }
    
    // Calculate angle for line direction and movement
    // Lines move PERPENDICULAR to their orientation (like rain/curtain effect)
    let angle, moveAngle
    if (orientation === 'horizontal-right') {
      angle = 0
      moveAngle = PI / 2 // Move downward (perpendicular)
    } else if (orientation === 'horizontal-left') {
      angle = 0
      moveAngle = -PI / 2 // Move upward (perpendicular)
    } else if (orientation === 'vertical-down') {
      angle = PI / 2
      moveAngle = 0 // Move rightward (perpendicular)
    } else if (orientation === 'vertical-up') {
      angle = PI / 2
      moveAngle = PI // Move leftward (perpendicular)
    } else if (orientation === 'diagonal-down-right') {
      angle = random(PI / 6, PI / 3) // 30-60 degrees
      moveAngle = angle + PI / 2 // Perpendicular movement
    } else if (orientation === 'diagonal-down-left') {
      angle = random(2 * PI / 3, 5 * PI / 6) // 120-150 degrees
      moveAngle = angle + PI / 2
    } else if (orientation === 'diagonal-up-right') {
      angle = random(-PI / 3, -PI / 6) // -30 to -60 degrees
      moveAngle = angle + PI / 2
    } else if (orientation === 'diagonal-up-left') {
      angle = random(-5 * PI / 6, -2 * PI / 3) // -120 to -150 degrees
      moveAngle = angle + PI / 2
    } else {
      // Free/chaos angle
      angle = random(TWO_PI)
      moveAngle = angle + PI / 2
    }
    
    // Starting position - random across canvas (not edge-locked)
    const startX = random(-width * 0.3, width * 1.3)
    const startY = random(-height * 0.3, height * 1.3)
    
    return {
      startX: startX,
      startY: startY,
      angle: angle, // Direction the line extends
      moveAngle: moveAngle, // Direction the line travels
      baseOffset: baseOffset,
      maxOffset: random(800, 2000), // Travel distance before starting to check exit
      baseSpeed: baseSpeed,
      segments: segments,
      harmonics: harmonics,
      thickness: random(3, 25),
      thicknessVariation: random(0.3, 10.8),
      color: random(palette),
      opacity: 100,
      isFading: false,  // Once true, line commits to fading out (no flicker)
      blendMode: this.getBlend([DIFFERENCE, ADD, MULTIPLY][index % 3]),
      orientation: orientation, // Keep for reference
      startT: startT,
      endT: endT,
      noiseSeedX: noiseSeedX,
      noiseSeedY: noiseSeedY,
      noiseScale: random(0.003, 0.08),
      noiseAmp: random(15, 40),
      dripFactor: random(0.5, 1.5),
      phaseSpeed: random(0.01, 0.04),
      birthTime: this.age || 0,
      maxLife: floor(random(144, 240)),  // Hard lifetime limit: 6-10 seconds at 24fps
      fadeInDuration: random(30, 60),
      speedEvolution: random(0.005, 0.02),
      speedNoiseScale: random(0.01, 0.03),
      lineLength: random(width * 0.8, width * 1.4), // How long the line extends
    }
  }
  
  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.lines = []
    this.persistMode = random() < 0.05  // Reduced from 0.5 to 0.05 - persist layers expensive for moving geometry
    this.directionMode = traits.wavyDirection || 'chaos'
    this.noiseOffset = random(1000)
    
    const lineCount = floor(random(5, 10))
    
    if (this.persistMode && !this.persistentLayer) {
      this.persistentLayer = createGraphics(width, height)
      this.persistentLayer.clear()
    } else if (!this.persistMode && this.persistentLayer) {
      this.persistentLayer.remove()
      this.persistentLayer = null
    } else if (this.persistMode && this.persistentLayer) {
      this.persistentLayer.clear()
    }
    
    for (let i = 0; i < lineCount; i++) {
      const orientation = this.pickOrientation()
      this.lines.push(this.createLine(orientation, palette, i))
    }
  }
  
  // Compute organic wave displacement at a point
  getWaveDisplacement(l, t, time) {
    const pos = t * l.lineLength
    
    // Sum multiple harmonics for organic feel
    let wave = 0
    for (const h of l.harmonics) {
      const animatedPhase = h.phase + time * l.phaseSpeed
      wave += sin(pos * 0.02 * h.freq + animatedPhase) * h.amp
    }
    
    // Add perlin noise for non-uniform organic variation
    const noiseVal = noise(
      l.noiseSeedX + pos * l.noiseScale, 
      l.noiseSeedY + time * 0.01 + this.noiseOffset
    )
    const noiseDisplacement = (noiseVal - 0.5) * 2 * l.noiseAmp
    
    // Modulate amplitude along the line (thicker/thinner waves)
    const ampModulation = noise(l.noiseSeedX + 100, t * 3) * 0.5 + 0.5
    
    return (wave * ampModulation + noiseDisplacement) * l.dripFactor
  }
  
  // Get variable thickness at a point
  getThicknessAt(l, t) {
    const thickNoise = noise(l.noiseSeedX + 200, t * 4)
    const variation = 1 - l.thicknessVariation + thickNoise * l.thicknessVariation * 2
    return l.thickness * variation
  }
  
  update() {
    super.update()
    const speedMultiplier = this.accelerateFade ? 4 : 1
    const time = this.age
    
    // Canvas bounds with padding
    const padding = 100
    const minX = -padding
    const maxX = width + padding
    const minY = -padding
    const maxY = height + padding
    
    for (let l of this.lines) {
      // Update each segment's offset with its own evolving speed
      let maxSegmentOffset = -Infinity
      let minSegmentOffset = Infinity
      
      for (let i = 0; i < l.segments.length; i++) {
        const seg = l.segments[i]
        const t = i / (l.segments.length - 1)
        
        // Dynamic speed modulation using noise - speed changes over time
        const speedNoise = noise(
          seg.speedNoiseSeed + time * l.speedEvolution,
          t * 3
        )
        // Map noise to speed multiplier (0.3 to 1.7 range for variety)
        const dynamicSpeedMult = 0.3 + speedNoise * 1.4
        
        // Update this segment's offset
        seg.offset += seg.speed * dynamicSpeedMult * speedMultiplier
        
        // Track the furthest and nearest segments
        maxSegmentOffset = max(maxSegmentOffset, seg.offset)
        minSegmentOffset = min(minSegmentOffset, seg.offset)
      }
      
      // Store for reference
      l.currentMaxOffset = maxSegmentOffset
      l.currentMinOffset = minSegmentOffset
      
      // Check if entire line is off-canvas
      let isOffCanvas = true
      const numSegments = l.segments.length - 1
      
      for (let i = 0; i <= numSegments && isOffCanvas; i++) {
        const t = i / numSegments
        if (t < l.startT || t > l.endT) continue
        
        const seg = l.segments[i]
        const wave = this.getWaveDisplacement(l, t, time)
        
        // Calculate position using angle-based system
        const alongLine = t * l.lineLength - l.lineLength / 2
        const baseX = l.startX + cos(l.angle) * alongLine
        const baseY = l.startY + sin(l.angle) * alongLine
        
        // Apply movement offset perpendicular to line
        const px = baseX + cos(l.moveAngle) * (seg.offset + wave)
        const py = baseY + sin(l.moveAngle) * (seg.offset + wave)
        
        // Check if this point is on canvas
        if (px >= minX && px <= maxX && py >= minY && py <= maxY) {
          isOffCanvas = false
        }
      }
      
      // Check if past max lifetime
      const lineAge = this.age - l.birthTime
      const pastMaxLife = lineAge > l.maxLife
      
      // Once fading starts, commit to it (prevents flicker from wave oscillation)
      if (l.isFading) {
        l.opacity = max(0, l.opacity - (this.accelerateFade ? 4 : 0.5))
      } else if (isOffCanvas && maxSegmentOffset > 0) {
        // Start fading - mark as committed
        l.isFading = true
        l.opacity = max(0, l.opacity - (this.accelerateFade ? 4 : 0.5))
      } else if (pastMaxLife) {
        // Past max life but still on canvas - accelerate movement to push it off faster
        for (let seg of l.segments) {
          seg.offset += seg.speed * 2  // Extra push to get off screen
        }
      }
    }
  }
  
  isDone() {
    return this.lines.every(l => l.opacity <= 0)
  }
  
  averageOpacity() {
    if (this.lines.length === 0) return 0
    return this.lines.reduce((sum, l) => sum + l.opacity, 0) / this.lines.length
  }
  
  display(g) {
    g.push()
    
    if (this.persistMode && this.persistentLayer) {
      g.image(this.persistentLayer, 0, 0)
    }
    
    const time = this.age
    
    for (let l of this.lines) {
      const targetBuffer = (this.persistMode && this.persistentLayer) ? this.persistentLayer : g
      
      // Calculate fade-in
      const lineAge = time - l.birthTime
      const fadeInAlpha = min(1, lineAge / l.fadeInDuration)
      const effectiveOpacity = l.opacity * fadeInAlpha
      
      if (effectiveOpacity <= 0) continue
      
      // Draw line as series of segments with varying thickness and individual offsets
      const numSegments = l.segments.length - 1
      
      // Pre-calculate all segment positions for multi-pass rendering
      const segmentData = []
      
      for (let i = 0; i < numSegments; i++) {
        const t1 = i / numSegments
        const t2 = (i + 1) / numSegments
        
        // Skip segments outside our partial span
        if (t2 < l.startT || t1 > l.endT) continue
        
        // Clamp to our span
        const segT1 = max(t1, l.startT)
        const segT2 = min(t2, l.endT)
        
        // Fade at edges of partial lines
        let edgeFade = 1
        const edgeWidth = 0.1
        if (segT1 < l.startT + edgeWidth) {
          edgeFade *= map(segT1, l.startT, l.startT + edgeWidth, 0, 1)
        }
        if (segT2 > l.endT - edgeWidth) {
          edgeFade *= map(segT2, l.endT - edgeWidth, l.endT, 1, 0)
        }
        
        const midT = (segT1 + segT2) / 2
        const thickness = this.getThicknessAt(l, midT)
        
        // Get per-segment offsets (interpolate for smooth transitions)
        const segIdx1 = floor(t1 * numSegments)
        const segIdx2 = min(segIdx1 + 1, numSegments)
        const localT = (t1 * numSegments) - segIdx1
        const offset1 = lerp(l.segments[segIdx1].offset, l.segments[segIdx2].offset, localT)
        
        const segIdx3 = floor(t2 * numSegments)
        const segIdx4 = min(segIdx3 + 1, numSegments)
        const localT2 = (t2 * numSegments) - segIdx3
        const offset2 = lerp(l.segments[segIdx3].offset, l.segments[segIdx4].offset, localT2)
        
        // Calculate positions using angle-based system
        const alongLine1 = segT1 * l.lineLength - l.lineLength / 2
        const alongLine2 = segT2 * l.lineLength - l.lineLength / 2
        
        const baseX1 = l.startX + cos(l.angle) * alongLine1
        const baseY1 = l.startY + sin(l.angle) * alongLine1
        const baseX2 = l.startX + cos(l.angle) * alongLine2
        const baseY2 = l.startY + sin(l.angle) * alongLine2
        
        const wave1 = this.getWaveDisplacement(l, segT1, time)
        const wave2 = this.getWaveDisplacement(l, segT2, time)
        
        const x1 = baseX1 + cos(l.moveAngle) * (offset1 + wave1)
        const y1 = baseY1 + sin(l.moveAngle) * (offset1 + wave1)
        const x2 = baseX2 + cos(l.moveAngle) * (offset2 + wave2)
        const y2 = baseY2 + sin(l.moveAngle) * (offset2 + wave2)
        
        segmentData.push({ x1, y1, x2, y2, thickness, edgeFade })
      }
      
      // === Single pass: Core line only ===
      targetBuffer.push()
      targetBuffer.blendMode(l.blendMode)
      targetBuffer.noFill()
      for (const seg of segmentData) {
        const coreColor = color(l.color)
        coreColor.setAlpha(effectiveOpacity * seg.edgeFade)
        targetBuffer.stroke(coreColor)
        targetBuffer.strokeWeight(seg.thickness)
        targetBuffer.line(seg.x1, seg.y1, seg.x2, seg.y2)
      }
      targetBuffer.pop()
    }
    
    g.pop()
  }
}

class Sparkles extends FillAnimation {
  constructor(x, y, palette, traits) {
    super(x, y, palette, traits)
    this.sparklePaths = []
    this.lifetime = 0
    this.maxLifetime = random(200, 400)  
    this.maxActivePaths = 40  
    this.palette = palette
    this.persistentLayer = null
  }
  
  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.sparklePaths = []
    this.lifetime = 0
    this.maxLifetime = random(200, 400)
    this.palette = palette
    
    if (!this.persistentLayer) {
      this.persistentLayer = createGraphics(width, height)
    }
    this.persistentLayer.clear()
    
    for (let i = 0; i < this.maxActivePaths; i++) {
      this.sparklePaths.push(this.createSparkle())
    }
  }
  
  createSparkle() {
    const angle = random(TWO_PI)
    const speed = random(1, 3) * FILL_ANIMATION_SPEED_MULT
    return {
      x: this.x,
      y: this.y,
      vx: cos(angle) * speed,
      vy: sin(angle) * speed,
      size: random(10, 50),
      color: random(this.palette),
      life: random(0, 80),
      maxLife: random(60, 180)
    }
  }
  
  resetSparkle(s) {
    const angle = random(TWO_PI)
    const speed = random(1, 3) * FILL_ANIMATION_SPEED_MULT
    s.x = this.x
    s.y = this.y
    s.vx = cos(angle) * speed
    s.vy = sin(angle) * speed
    s.size = random(10, 50)
    s.color = random(this.palette)
    s.life = 0
    s.maxLife = random(60, 180)
  }
  
  update() {
    super.update()
    this.lifetime++
    
    const stillSpawning = this.lifetime < this.maxLifetime
    const pl = this.persistentLayer
    
    pl.push()
    pl.noStroke()
    pl.blendMode(MULTIPLY)
    
    const bounds = globalBounds
    const hasB = !!bounds
    const bounce = 0.7
    
    for (let i = 0; i < this.sparklePaths.length; i++) {
      const s = this.sparklePaths[i]
      
      pl.fill(s.color)
      pl.circle(s.x, s.y, s.size)
      
      let x = s.x + s.vx
      let y = s.y + s.vy
      
      if (hasB) {
        if (x < bounds.minX) { x = bounds.minX; s.vx = Math.abs(s.vx) * bounce }
        else if (x > bounds.maxX) { x = bounds.maxX; s.vx = -Math.abs(s.vx) * bounce }
        if (y < bounds.minY) { y = bounds.minY; s.vy = Math.abs(s.vy) * bounce }
        else if (y > bounds.maxY) { y = bounds.maxY; s.vy = -Math.abs(s.vy) * bounce }
      }
      
      s.x = x
      s.y = y
      s.life++
      
      if (s.life > s.maxLife) {
        if (stillSpawning) {
          this.resetSparkle(s)
        }
      }
    }
    
    pl.pop()
  }
  
  display(g) {
    g.push()
    const visualOpacity = this.getVisualOpacity()
    if (visualOpacity < 255) {
      g.tint(255, visualOpacity)
    }
    g.image(this.persistentLayer, 0, 0)
    g.pop()
  }
  
  getVisualOpacity() {
    if (this.lifetime < this.maxLifetime) {
      return 255
    }
    const fadeTime = 200
    const timeSinceEnd = this.lifetime - this.maxLifetime
    return max(0, map(timeSinceEnd, 0, fadeTime, 255, 0))
  }
  
  isDone() {
    return this.getVisualOpacity() <= 0
  }
  
  averageOpacity() {
    if (this.lifetime < this.maxLifetime) {
      return 100  
    }
    return this.getVisualOpacity() + 100
  }
}

class VoronoiCells extends FillAnimation {
  constructor(x, y, palette, traits) {
    super(x, y, palette, traits)
    this.cells = []
    const cellCount = floor(random(8, 15))
    
    for (let i = 0; i < cellCount; i++) {
      const angle = random(TWO_PI)
      const dist = random(20, 80)
      this.cells.push({
        x: this.x + cos(angle) * dist,
        y: this.y + sin(angle) * dist,
        vx: cos(angle) * random(0.1, 0.4) * FILL_ANIMATION_SPEED_MULT,
        vy: sin(angle) * random(0.1, 0.4) * FILL_ANIMATION_SPEED_MULT,
        radius: random(15, 35),
        targetRadius: random(60, 120),
        color: random(palette),
        opacity: 100,
        blendMode: this.getBlend([DIFFERENCE, ADD, MULTIPLY][i % 3]),
        growthSpeed: random(0.3, 0.8) * FILL_ANIMATION_SPEED_MULT
      })
    }
  }

  reset(x, y, palette, traits) {
    super.reset(x, y, palette, traits)
    this.cells = []
    const cellCount = floor(random(8, 15))
    
    for (let i = 0; i < cellCount; i++) {
      const angle = random(TWO_PI)
      const dist = random(20, 80)
      this.cells.push({
        x: this.x + cos(angle) * dist,
        y: this.y + sin(angle) * dist,
        vx: cos(angle) * random(0.1, 0.4) * FILL_ANIMATION_SPEED_MULT,
        vy: sin(angle) * random(0.1, 0.4) * FILL_ANIMATION_SPEED_MULT,
        radius: random(15, 35),
        targetRadius: random(60, 120),
        color: random(palette),
        opacity: 100,
        blendMode: this.getBlend([DIFFERENCE, ADD, MULTIPLY][i % 3]),
        growthSpeed: random(0.3, 0.8) * FILL_ANIMATION_SPEED_MULT
      })
    }
  }

  update() {
    super.update()
    
    for (let c of this.cells) {
      if (c.radius < c.targetRadius) {
        c.radius += c.growthSpeed
      }
      
      // Slow drift
      let newX = c.x + c.vx
      let newY = c.y + c.vy
      
      const constrained = constrainToMaskBounds(newX, newY, c.vx, c.vy)
      c.x = constrained.x
      c.y = constrained.y
      c.vx = constrained.vx
      c.vy = constrained.vy
      
      const pulse = sin(this.age * 0.05) * 3
      c.displayRadius = c.radius + pulse
      
      // More gradual fade
      const fadeMultiplier = this.accelerateFade ? 4 : 1
      c.opacity = max(0, c.opacity - 0.1 * fadeMultiplier)
    }
  }

  display(g) {
    for (let c of this.cells) {
      if (c.opacity <= 0) continue
      
      g.push()
      g.blendMode(c.blendMode)
      
      // Apply cell's opacity
      const col = g.color(c.color)
      col.setAlpha(c.opacity)
      g.fill(col)
      g.noStroke()
      
      g.circle(c.x, c.y, c.displayRadius * 2)
      
      g.pop()
    }
  }

  isDone() {
    return this.cells.every(c => c.opacity <= 0)
  }

  averageOpacity() {
    if (this.cells.length === 0) return 0
    return this.cells.reduce((sum, c) => sum + c.opacity, 0) / this.cells.length
  }
}

class AnimationPool {
  constructor() {
    this.pools = {
      Supernova: [],
      ExpandingCircles: [],
      ExpandingSquares: [],
      VerticalStripes: [],
      HorizontalStripes: [],
      GradientFill: [],
      WavyLines: [],
      Sparkles: [],
      VoronoiCells: []
    }
    
    this.maxPoolSize = 100 
  }
  
  createNew(type) {
    switch(type) {
      case 'Supernova':
        return new Supernova(0, 0, [], 0, [0, 0], {})
      case 'ExpandingCircles':
        return new ExpandingCircles(0, 0, [], {})
      case 'ExpandingSquares':
        return new ExpandingSquares(0, 0, [], {})
      case 'VerticalStripes':
        return new VerticalStripes(0, 0, [], {})
      case 'HorizontalStripes':
        return new HorizontalStripes(0, 0, [], {})
      case 'GradientFill':
        return new GradientFill(0, 0, [], {})
      case 'WavyLines':
        return new WavyLines(0, 0, [], {})
      case 'Sparkles':
        return new Sparkles(0, 0, [], {})
      case 'VoronoiCells':
        return new VoronoiCells(0, 0, [], {})
      default:
        return null
    }
  }
  
  acquire(type, x, y, palette, ...extraArgs) {
    const pool = this.pools[type]
    let obj = pool.pop()
    
    if (!obj) {
      obj = this.createNew(type)
    }
    
    obj.reset(x, y, palette, ...extraArgs)
    
    return obj
  }
  
  release(obj) {
    const type = obj.constructor.name
    const pool = this.pools[type]
    
    // Clean up persistent graphics buffers to prevent memory leaks
    if (obj.persistentLayer) {
      obj.persistentLayer.remove()
      obj.persistentLayer = null
    }
    
    if (pool && pool.length < this.maxPoolSize) {
      pool.push(obj)
    }
  }
  
  clear() {
    Object.keys(this.pools).forEach(key => {
      this.pools[key] = []
    })
  }
  
  getStats() {
    const stats = {}
    Object.entries(this.pools).forEach(([type, pool]) => {
      stats[type] = pool.length
    })
    return stats
  }
}

/* ========================= BREATHING ANIMATION WITH CASCADING DELAYS ========================= */

function breathWave(t, hz) {
  
  const cycleTime = 1.0 / hz
  const phase = (t % cycleTime) / cycleTime
  
  if (phase < 0.65) {
    const p = phase / 0.65
    const sine = Math.sin(p * Math.PI)
    return Math.pow(sine, 0.7)
  } else {
    return 0.0
  }
}

function getBreathTime() {
  if (_breathStartMillis === null) _breathStartMillis = millis()
  return (millis() - _breathStartMillis) / 1000.0
}

function formBreathOffsetPart2() {
  const t = getBreathTime()
  const wave = breathWave(t, FORM_BREATH_HZ)
  return wave * FORM_BREATH_AMP
}

function formBreathOffsetPart1() {
  const t = getBreathTime()
  const delayedT = t - BREATH_DELAY_PART1
  const wave = breathWave(delayedT, FORM_BREATH_HZ)
  return wave * FORM_BREATH_AMP
}

function maskBreathOffset() {
  const t = getBreathTime()
  const delayedT = t - BREATH_DELAY_MASK
  const wave = breathWave(delayedT, FORM_BREATH_HZ)
  return wave * FORM_BREATH_AMP
}

/* ========================= EYE FLICKER ========================= */

function getEyeOpacity() {
  
  if (eyesFullyOn) return 1.0
  
  const relativeFrame = frameCount - regenStartFrame
  const flickerEnd = eyesFlickerStart + eyesFlickerDuration
  
  if (relativeFrame < eyesFlickerStart) {
    return 0.0
  } else if (relativeFrame >= flickerEnd) {
    eyesFullyOn = true
    return 1.0
  } else {
    const flickerProgress = (relativeFrame - eyesFlickerStart) / eyesFlickerDuration
    
    const flickerSpeed = map(flickerProgress, 0, 1, 8, 2)
    const baseOpacity = map(flickerProgress, 0, 1, 0.3, 1.0)
    
    const flicker = noise(frameCount * flickerSpeed) > 0.4 ? 1.0 : 0.0
    
    return baseOpacity * flicker
  }
}

/* ========================= MASK BOUNDS HELPERS ========================= */

function calculateMaskBounds() {
  maskBoundsCache = []
  
  for (const m of masks) {
    const padding = 20
    const bounds = {
      minX: m.x - m.w / 2 + padding,
      maxX: m.x + m.w / 2 - padding,
      minY: m.y - m.h / 2 + padding,
      maxY: m.y + m.h / 2 - padding,
      centerX: m.x,
      centerY: m.y,
      w: m.w,
      h: m.h,
      mask: m
    }
    maskBoundsCache.push(bounds)
  }
  
  calculateGlobalBounds()
}

function calculateGlobalBounds() {
  if (maskBoundsCache.length === 0) {
    globalBounds = null
    return
  }
  
  let minX = Infinity, maxX = -Infinity
  let minY = Infinity, maxY = -Infinity
  
  for (const bounds of maskBoundsCache) {
    minX = min(minX, bounds.minX)
    maxX = max(maxX, bounds.maxX)
    minY = min(minY, bounds.minY)
    maxY = max(maxY, bounds.maxY)
  }
  
  globalBounds = {
    minX: minX,
    maxX: maxX,
    minY: minY,
    maxY: maxY,
    centerX: (minX + maxX) / 2,
    centerY: (minY + maxY) / 2
  }
}

function getRandomPointInMasks() {
  if (maskBoundsCache.length === 0) return { x: width / 2, y: height / 2 }
  
  const bounds = random(maskBoundsCache)
  
  return {
    x: random(bounds.minX, bounds.maxX),
    y: random(bounds.minY, bounds.maxY)
  }
}

function constrainToMaskBounds(x, y, vx, vy) {
  if (!globalBounds) return { x, y, vx, vy }
  
  let newX = x
  let newY = y
  let newVx = vx
  let newVy = vy
  const bounce = 0.7
  
  if (x < globalBounds.minX) {
    newX = globalBounds.minX
    newVx = Math.abs(vx) * bounce
  } else if (x > globalBounds.maxX) {
    newX = globalBounds.maxX
    newVx = -Math.abs(vx) * bounce
  }
  
  if (y < globalBounds.minY) {
    newY = globalBounds.minY
    newVy = Math.abs(vy) * bounce
  } else if (y > globalBounds.maxY) {
    newY = globalBounds.maxY
    newVy = -Math.abs(vy) * bounce
  }
  
  return { x: newX, y: newY, vx: newVx, vy: newVy }
}

function initTopology() {
  const getConstrainedOrigin = () => {
    if (maskBoundsCache.length === 0) {
      return { x: width / 2, y: height / 2 }
    }
    return getRandomPointInMasks()
  }
  
  if (TRAITS.originTopology === "Clustered Burst") {
    originCenters = [getConstrainedOrigin()]
  } else if (TRAITS.originTopology === "Dual-Core") {
    if (maskBoundsCache.length >= 2) {
      const bounds1 = maskBoundsCache[0]
      const bounds2 = maskBoundsCache[maskBoundsCache.length > 1 ? 1 : 0]
      originCenters = [
        { x: bounds1.centerX + random(-60, 60), y: bounds1.centerY + random(-60, 60) },
        { x: bounds2.centerX + random(-60, 60), y: bounds2.centerY + random(-60, 60) }
      ]
    } else {
      const pt = getConstrainedOrigin()
      originCenters = [
        { x: pt.x - 80, y: pt.y },
        { x: pt.x + 80, y: pt.y }
      ]
    }
  } else if (TRAITS.originTopology === "Radial Drift") {
    originCenters = [getConstrainedOrigin()]
  } else if (TRAITS.originTopology === "Tidal Sweep") {
    tidalAngle = random(-PI / 9, PI / 9)
  } else if (TRAITS.originTopology === "Void Edge") {
    if (maskBoundsCache.length > 0) {
      const bounds = random(maskBoundsCache)
      let side = floor(random(4))
      if (side === 0) originCenters = [{ x: bounds.centerX, y: bounds.minY }]
      else if (side === 1) originCenters = [{ x: bounds.maxX, y: bounds.centerY }]
      else if (side === 2) originCenters = [{ x: bounds.centerX, y: bounds.maxY }]
      else originCenters = [{ x: bounds.minX, y: bounds.centerY }]
    } else {
      originCenters = [{ x: width / 2, y: height / 2 }]
    }
  } else {
    originCenters = [getConstrainedOrigin()]
  }
}

function spawner() {
  if (frameCount >= nextSpawnFrame) {
    spawnFillAnimation()
    
    // Determine next spawn based on breath trait
    const breath = TRAITS.breath
    if (breath === "Erratic") {
      nextSpawnFrame = frameCount + floor(random(4, PARAMS.baseSpawnEvery * 2))
    } else if (breath === "Held") {
      // Long pauses, then burst
      if (random() < 0.15) {
        for (let i = 0; i < 4; i++) spawnFillAnimation()
        nextSpawnFrame = frameCount + PARAMS.baseSpawnEvery * 3
      } else {
        nextSpawnFrame = frameCount + PARAMS.baseSpawnEvery
      }
    } else {
      // Steady, Slow, Quick - use baseSpawnEvery directly
      nextSpawnFrame = frameCount + PARAMS.baseSpawnEvery
    }
  }
}

function spawnFillAnimation() {
  // Get spawn point from origin system
  const pt = getSpawnPoint()
  let sx = pt.x
  let sy = pt.y

  const variant = PARAMS.fillVariant
  let animation
  
  if (variant === "Sparkles") {
    const sparkleCount = fillAnimations.filter(a => a instanceof Sparkles).length
    if (sparkleCount >= 6) return
  }
  
  if (variant === "Supernova") {
    const count = floor(random(1, 3))
    animation = animationPool.acquire('Supernova', sx, sy, PARAMS.palette, count, PARAMS.sizeRange, TRAITS)
  } else if (variant === "ExpandingCircles") {
    animation = animationPool.acquire('ExpandingCircles', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "ExpandingSquares") {
    animation = animationPool.acquire('ExpandingSquares', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "VerticalStripes") {
    animation = animationPool.acquire('VerticalStripes', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "Gradient") {
    animation = animationPool.acquire('GradientFill', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "WavyLines") {
    animation = animationPool.acquire('WavyLines', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "Sparkles") {
    animation = animationPool.acquire('Sparkles', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "HorizontalStripes") {
    animation = animationPool.acquire('HorizontalStripes', sx, sy, PARAMS.palette, TRAITS)
  } else if (variant === "VoronoiCells") {
    animation = animationPool.acquire('VoronoiCells', sx, sy, PARAMS.palette, TRAITS)
  }
  
  if (animation) {
    fillAnimations.push(animation)
  }
}

function drawBackground(g, bgType) {
  g.push()
  g.noStroke()
  
  if (TRAITS.paletteName === "Doomed") {
    g.background(0, 0, 20) 
  } else if (bgType === "Halo") {
    g.background(0, 0, 75)
  } else if (bgType === "Aero") {
    g.background(200, 15, 85)
  } else if (bgType === "Rose") {
    g.background(330, 25, 90)
  } else if (bgType === "Mint") {
    g.background(150, 20, 88)
  } else if (bgType === "Mist") {
    g.background(270, 18, 88)
  } else if (bgType === "Rise") {
    g.background(20, 30, 90)
  } else if (bgType === "Fallen") {  
    g.background(0, 100, 90) 
  } 
  
  else if (bgType === "Shift") {
    const colors = PARAMS.palette
    const c1 = g.color(colors[0])
    const c2 = g.color(colors[colors.length - 1])
    
    const ctx = g.drawingContext
    const grad = ctx.createLinearGradient(0, 0, 0, g.height)
    grad.addColorStop(0, g.color(colors[0]).toString())
    grad.addColorStop(1, g.color(colors[colors.length - 1]).toString())
    
    ctx.fillStyle = grad
    ctx.fillRect(0, 0, g.width, g.height)
  } 
  
  else if (bgType === "Radiant") {
    const colors = PARAMS.palette
    const centerX = g.width / 2
    const centerY = g.height / 2
    const radius = Math.sqrt(centerX * centerX + centerY * centerY)
    
    const ctx = g.drawingContext
    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius)
    grad.addColorStop(0, g.color(colors[0]).toString())
    grad.addColorStop(1, g.color(colors[colors.length - 1]).toString())
    
    ctx.fillStyle = grad
    ctx.fillRect(0, 0, g.width, g.height)
  }
  
  else if (bgType === "Facet") {
    const colors = PARAMS.palette
    const centerX = g.width / 2
    const centerY = g.height / 2
    const maxDist = centerX + centerY
    
    const stepSize = 4 
    for (let y = 0; y < g.height; y += stepSize) {
      for (let x = 0; x < g.width; x += stepSize) {
        const d = Math.abs(x - centerX) + Math.abs(y - centerY)
        const inter = constrain(d / maxDist, 0, 1)
        
        const c1 = g.color(colors[0])
        const c2 = g.color(colors[colors.length - 1])
        const gradColor = g.lerpColor(c1, c2, inter)
        
        g.fill(gradColor)
        g.noStroke()
        g.rect(x, y, stepSize, stepSize)
      }
    }
  } 
  
  else if (bgType === "Ascend") {
    const colors = PARAMS.palette
    const maxDist = g.width + g.height
    
    const stepSize = 4
    for (let y = 0; y < g.height; y += stepSize) {
      for (let x = 0; x < g.width; x += stepSize) {
        const d = x + y
        const inter = constrain(d / maxDist, 0, 1)
        
        const c1 = g.color(colors[0])
        const c2 = g.color(colors[colors.length - 1])
        const gradColor = g.lerpColor(c1, c2, inter)
        
        g.fill(gradColor)
        g.noStroke()
        g.rect(x, y, stepSize, stepSize)
      }
    }
  } 
  
  else if (bgType === "Descend") {
    const colors = PARAMS.palette
    const maxDist = g.width + g.height
 
    const stepSize = 4
    for (let y = 0; y < g.height; y += stepSize) {
      for (let x = 0; x < g.width; x += stepSize) {
        const d = (g.width - x) + (g.height - y)
        const inter = constrain(d / maxDist, 0, 1)
        
        const c1 = g.color(colors[0])
        const c2 = g.color(colors[colors.length - 1])
        const gradColor = g.lerpColor(c1, c2, inter)
        
        g.fill(gradColor)
        g.noStroke()
        g.rect(x, y, stepSize, stepSize)
      }
    }
  } 
  
  else {
    g.background(0, 0, 100)
  }
  
  g.pop()
}

function drawPrimeArchetype(g, scaleX, scaleY) {
  g.beginShape()
  
  let x = -2.3 * scaleX
  let y = 881.6 * scaleY
  g.vertex(x, y)
  
  let cp1x = x + 34.5 * scaleX
  let cp1y = y - 70 * scaleY
  let cp2x = x + 80.7 * scaleX
  let cp2y = y - 134.8 * scaleY
  x += 130.5 * scaleX
  y -= 193.7 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  cp1x = x + 64.9 * scaleX
  cp1y = y - 76.8 * scaleY
  cp2x = x + 78.7 * scaleX
  cp2y = y - 250.3 * scaleY
  x += 100.8 * scaleX
  y -= 385.7 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  cp1x = x + 17.8 * scaleX
  cp1y = y - 109.2 * scaleY
  cp2x = x + 134.3 * scaleX
  cp2y = y - 225.2 * scaleY
  x += 272.5 * scaleX
  y -= 225.3 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  cp1x = 2 * x - cp2x
  cp1y = 2 * y - cp2y
  cp2x = x + 244.5 * scaleX
  cp2y = y + 116 * scaleY
  x += 263.8 * scaleX
  y += 265.3 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  cp1x = x + 42.3 * scaleX
  cp1y = y + 274.2 * scaleY
  cp2x = x + 91.2 * scaleX
  cp2y = y + 343 * scaleY
  x += 91.2 * scaleX
  y += 343 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  cp1x = x + 56.5 * scaleX
  cp1y = y + 79.5 * scaleY
  cp2x = x + 143.4 * scaleX
  cp2y = y + 199.4 * scaleY
  x += 143.4 * scaleX
  y += 199.4 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  y += 115.4 * scaleY
  g.vertex(x, y)
  
  cp1x = x + 0 * scaleX
  cp1y = y + 0 * scaleY
  cp2x = x - 1000.9 * scaleX
  cp2y = y + 2.7 * scaleY
  x -= 1000.9 * scaleX
  y += 2.7 * scaleY
  g.bezierVertex(cp1x, cp1y, cp2x, cp2y, x, y)
  
  x -= 1.2 * scaleX
  y -= 120.9 * scaleY
  g.vertex(x, y)
  
  g.endShape(CLOSE)
}

/* ========================= MASK LAYOUT ========================= */

function layoutMasks() {
  const count = TRAITS.count
  const cx = width / 2, cy = height / 2
  const baseW = min(width, height) * 0.62
  const baseH = baseW * 1.18

  if (count === "Mono") {
    masks.push(makeMask(cx, cy, baseW, baseH, 0, 0))
  } else if (count === "Conflux") {
    const maskWidth = baseW * 0.86
    const gap = maskWidth * 0.36
    
    masks.push(makeMask(cx - gap / 2, cy, maskWidth, baseH * 0.86, -0.03, 0))
    masks.push(makeMask(cx + gap / 2, cy, maskWidth, baseH * 0.86, 0.03, 1))
  }
}

function makeMask(x, y, w, h, rot, maskIndex) {
  return {
    x, y, w, h, rot, maskIndex,
    edgeStyle: TRAITS.edgeStyle,
    sight: TRAITS.sight,
    voice: TRAITS.voice,
    scent: TRAITS.scent,
    ornament: TRAITS.ornament,
    hollows: TRAITS.hollows,
  }
}

/* ========================= MASK DRAWING ========================= */

function drawMaskEyesBlocking(pg, m) {

  pg.push()
  pg.translate(m.x, m.y)
  pg.rotate(PARAMS.axisLock ? 0 : m.rot)
  
  const rx = m.w * 0.22
  const ry = m.h * 0.13
  const ly = -m.h * 0.12
  const left = { x: -m.w * 0.18, y: ly }
  const right = { x: m.w * 0.18, y: ly }

  pg.noStroke()
  pg.fill(0, 0, 10)  
  
  if (TRAITS.iris === "Null" || TRAITS.iris === "Fury" || TRAITS.iris === "Plasma" || TRAITS.iris === "Omnia") {

    const strokeW = m.w * 0.03
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, strokeW)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, strokeW)
    } else {
      drawEye(pg, left, rx, ry, m.sight, strokeW)
      drawEye(pg, right, rx, ry, m.sight, strokeW)
    }
  } else if (TRAITS.iris === "Abyss") {

    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, 0)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
    } else {
      drawEye(pg, left, rx, ry, m.sight, 0)
      drawEye(pg, right, rx, ry, m.sight, 0)
    }
  }
  
  pg.pop()
}

  if (TRAITS.iris === "Null") {

    pg.fill(0, 0, 100) 
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, 0)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
    } else {
      drawEye(pg, left, rx, ry, m.sight, 0)
      drawEye(pg, right, rx, ry, m.sight, 0)
    }
  } else if (TRAITS.iris === "Fury") {
    // Red fill flickers on
    pg.fill(0, 100, 100)
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, 0)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
    } else {
      drawEye(pg, left, rx, ry, m.sight, 0)
      drawEye(pg, right, rx, ry, m.sight, 0)
    }
  } else if (TRAITS.iris === "Plasma") {

    pg.fill(185, 100, 100)
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, 0)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
    } else {
      drawEye(pg, left, rx, ry, m.sight, 0)
      drawEye(pg, right, rx, ry, m.sight, 0)
    }
  } else if (TRAITS.iris === "Omnia") {
    const cycleSpeed = 0.08
    const palette = PARAMS.palette
    
    const complementaryHues = palette.map(c => {

      const col = color(c)
      const h = hue(col)
      return (h + 180) % 360  
    })
    
    const cyclePosition = (millis() * cycleSpeed) % (complementaryHues.length * 100)
    const colorIndex = floor(cyclePosition / 100) % complementaryHues.length
    const nextIndex = (colorIndex + 1) % complementaryHues.length
    const blend = (cyclePosition % 100) / 100
    
    const currentHue = lerp(complementaryHues[colorIndex], complementaryHues[nextIndex], blend)
    
    pg.fill(currentHue, 100, 100)
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, 0)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
    } else {
      drawEye(pg, left, rx, ry, m.sight, 0)
      drawEye(pg, right, rx, ry, m.sight, 0)
    }
  } else if (TRAITS.iris === "Abyss") {

    const strokeW = m.w * 0.03
    pg.fill(0, 0, 100) 
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, strokeW)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, strokeW)
    } else {
      drawEye(pg, left, rx, ry, m.sight, strokeW)
      drawEye(pg, right, rx, ry, m.sight, strokeW)
    }

    pg.erase()
    if (m.sight === "Mono") {
      const center = { x: 0, y: ly }
      drawEye(pg, center, rx, ry, m.sight, 0)
    } else if (m.sight === "Verge") {
      drawVerticalAlmondTotal(pg, rx, ry, ly, m.w, 0)
    } else {
      drawEye(pg, left, rx, ry, m.sight, 0)
      drawEye(pg, right, rx, ry, m.sight, 0)
    }
    pg.noErase()
  }
  
  pg.pop()
}

// Draw white eyes for Omnia - used as base for tinting
function drawMaskEyesOmniaBase(pg, m) {
  pg.push()
  pg.translate(m.x, m.y)
  pg.rotate(PARAMS.axisLock ? 0 : m.rot)
  
  const rx = m.w * 0.22
  const ry = m.h * 0.13
  const ly = -m.h * 0.12
  const left = { x: -m.w * 0.18, y: ly }
  const right = { x: m.w * 0.18, y: ly }

  pg.noStroke()
  pg.fill(0, 0, 100) // White fill - will be tinted
